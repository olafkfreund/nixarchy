name: update

on:
  schedule:
    # Nightly, not weekly. These publish often -- hey-cli moved to 1.4.1 while
    # the 2026-09-05 nightly review watched a weekly job that would not look
    # again until Monday. A bump that waits six days for its cron is stale on
    # arrival.
    #
    # The comment that stood here said the nixpkgs-sourced apps "need nothing
    # here -- they follow whatever nixpkgs a user's own `nix flake update`
    # pulls". They follow the pin this repo commits, and nothing updated it:
    # on 2026-09-05 that pin was twelve days old, and claude-code, codex,
    # opencode, ollama and zed-editor were each several versions behind what
    # nixpkgs already had ready. flake-update.yml now moves the pin nightly;
    # this job keeps its own scope, the packages pinned here by version and
    # hash.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
      - uses: cachix/cachix-action@v17
        # A cache upload failing must not fail a build that succeeded (#235).
        continue-on-error: true
        with:
          # Pull only. What reaches the cache is pushed by name, from main, by
          # cachix-push.sh -- the store diff filled the free tier (#697).
          skipPush: true
          # Why: .github/actions/setup-nix/action.yml -- `cachix use` would replace its substituters.
          skipAddingSubstituter: true
          name: nixarchy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Bump pinned packages
        id: bump
        run: |
          # The app exits 1 if any updater failed, and a failed updater leaves
          # its file unchanged, so the bumps that did land still go on (#1537).
          nix run .#update || echo "update_failed=true" >> "$GITHUB_OUTPUT"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "nothing to bump"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Build every bumped package
        id: build
        if: steps.bump.outputs.changed == 'true'
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          # A stale hash left behind by a broken rewrite fails here rather than
          # in a user's rebuild. The updater refuses to bump a version without
          # its hashes, but this is the check that actually proves it.
          #
          # Derived from the same set the updater ran, not named by hand: the
          # old list here named a package this job could never change (it had
          # no updateScript) and skipped one it could (hey-cli). Building every
          # package with an updateScript rather than only what changed is
          # deliberate -- it avoids trusting a filename-to-attribute convention
          # nothing enforces.
          mapfile -t attrs < <(nix eval --json .#update.pinned | jq -r '.[] | ".#" + .')

          # mapfile returns 0 whatever the process substitution did -- a failed
          # eval, a renamed output, a jq that is not there -- and an empty
          # array would then build nothing and report every bump as built.
          #
          # The set is every package with an updateScript (ten today). The
          # floor is 1 so removing a package from the set is an ordinary edit
          # and not a CI break, while "the list came back empty" still stops
          # the job.
          if [ "${#attrs[@]}" -eq 0 ]; then
            echo "::error::.#update.pinned produced no attributes, so this step" \
                 "would pass without checking the packages the bump just" \
                 "rewrote" >&2
            exit 1
          fi

          # One build per package, so one broken upstream neither hides nor
          # cancels the others (#1537). A package that does not build has its
          # file restored from HEAD -- not the index (CLAUDE.md §5) -- and the
          # bumps that built still reach the pull request.
          failed=()
          for a in "${attrs[@]}"; do
            echo "building: $a"
            nix build --impure --print-build-logs "$a" || failed+=("${a#.#}")
          done

          for name in "${failed[@]}"; do
            pos=$(nix eval --raw ".#$name.meta.position") || {
              echo "::error::cannot find the file that defines $name" >&2
              exit 1
            }
            file=${pos#*-source/}
            file=${file%:*}
            # Refuse rather than guess: a revert outside pkgs/ is not ours to make.
            if [[ $file != pkgs/* || ! -f $file ]]; then
              echo "::error::$name is defined at '$pos', not in a pkgs/ file;" \
                   "refusing to revert it" >&2
              exit 1
            fi
            echo "reverting $name: $file did not build"
            git checkout HEAD -- "$file"
          done

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "failed=${failed[*]}" >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        if: steps.build.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # Opened under BUMP_TOKEN so build.yml actually runs on it. With the
          # default GITHUB_TOKEN a pull request triggers no workflows at all,
          # which made the claim in the body below -- "Every package here built
          # successfully in CI" -- mean only "built in this same job".
          # Measured 2026-09-05: a PR opened with BUMP_TOKEN started six check
          # runs within fifteen seconds; the same query against a
          # GITHUB_TOKEN-opened PR returned zero. This one still does NOT
          # auto-merge, for the reason the body gives.
          token: ${{ secrets.BUMP_TOKEN || github.token }}
          branch: update/pinned-packages
          title: "Bump pinned packages"
          commit-message: |
            Bump pinned packages

            Generated by .github/workflows/update.yml.
          body: |
            Automated version and hash bumps for the packages this repo pins
            by hand. Apps that come from nixpkgs are not touched: they follow
            whatever nixpkgs a user's own `nix flake update` resolves.

            Every package here built in the job that opened this pull
            request, and the repository CI runs on it as well.

            **A build is not proof the app still works.** Two of these are
            proprietary Electron bundles that can compile fine and crash at
            launch, so this is deliberately not auto-merged — please launch
            anything that changed before merging.

            ${{ steps.build.outputs.failed && format('Reverted, did not build: {0}. See the run log.', steps.build.outputs.failed) || '' }}
          labels: dependencies
          delete-branch: true

      # The pull request above carries what built; this keeps the run red so
      # review.yml's row still shows the night something broke (#1537).
      - name: Fail when anything did not update or build
        if: always() && (steps.bump.outputs.update_failed == 'true' || steps.build.outputs.failed != '')
        env:
          UPDATE_FAILED: ${{ steps.bump.outputs.update_failed }}
          BUILD_FAILED: ${{ steps.build.outputs.failed }}
        run: |
          [ "$UPDATE_FAILED" = true ] &&
            echo "::error::at least one updater failed; its package was not bumped (see 'Bump pinned packages')"
          [ -n "$BUILD_FAILED" ] &&
            echo "::error::reverted, did not build: $BUILD_FAILED"
          exit 1
