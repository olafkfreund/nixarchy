name: update

on:
  schedule:
    # Weekly. The 29 apps that come from nixpkgs need nothing here -- they
    # follow whatever nixpkgs a user's own `nix flake update` pulls. This is
    # only for the handful pinned by version and hash in this repo.
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v15
        with:
          name: nixarchy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Bump pinned packages
        id: bump
        run: |
          nix run .#update
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "nothing to bump"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Build every bumped package
        if: steps.bump.outputs.changed == 'true'
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          # A stale hash left behind by a broken rewrite fails here rather than
          # in a user's rebuild. The updater refuses to bump a version without
          # its hashes, but this is the check that actually proves it.
          nix build --impure --print-build-logs \
            .#once .#grok-bot

      - name: Open a pull request
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update/pinned-packages
          title: "Bump pinned packages"
          commit-message: |
            Bump pinned packages

            Generated by .github/workflows/update.yml.
          body: |
            Automated version and hash bumps for the packages this repo pins
            by hand. Apps that come from nixpkgs are not touched: they follow
            whatever nixpkgs a user's own `nix flake update` resolves.

            Every package here built successfully in CI.

            **A build is not proof the app still works.** Two of these are
            proprietary Electron bundles that can compile fine and crash at
            launch, so this is deliberately not auto-merged — please launch
            anything that changed before merging.
          labels: dependencies
          delete-branch: true
