# The nixpkgs pin moves every night, so the apps this repo hands people are
# the ones upstream shipped this week rather than the ones it shipped when
# somebody last ran `nix flake update` by hand.
#
# Nothing in this repo updated flake.lock's nixpkgs before this workflow.
# omarchy.yml bumps the omarchy input and update.yml bumps the packages pinned
# here by version and hash; the apps that come FROM nixpkgs followed whatever
# pin happened to be committed. On 2026-09-05 that pin was 56c02bc, dated
# 2026-08-23 -- thirteen days old.
#
# Measured, by running this workflow's own before/after against 801bef6:
# SEVENTEEN catalogue apps moved on that single bump, including
#
#   vscode       1.133.0 -> 1.135.0
#   zed-editor   1.16.1  -> 1.17.2
#   code-cursor  3.16.29 -> 3.17.21
#   emacs        30.2    -> 31.1
#   lmstudio     0.4.21-2 -> 0.4.23-1
#
# and, for the coding agents this repo does not yet offer but is asked about,
# claude-code 2.1.238 -> 2.1.258, codex 0.149.0 -> 0.151.0, opencode
# 1.18.21 -> 1.18.25, ollama 0.32.14 -> 0.33.1.
#
# Almost all of that gap was the stale pin, not nixpkgs lagging upstream --
# nixpkgs tracks these within days. One nightly input bump recovers it for
# every nixpkgs-sourced app at once, with no per-package version or hash to
# maintain by hand. Where nixpkgs itself is materially behind (gemini-cli sat
# at 0.47.0 on both revisions while upstream was at 0.58.0) no pin bump can
# help and the app needs its own package; that is a separate decision, and not
# something to automate here.
#
# NIXPKGS ONLY, deliberately. `nix flake update` with no argument resolves
# every mobile input, and some of these are pinned on purpose: the nightly
# review records disko as "a ref chosen on purpose that has not moved in 227
# days". A nightly job that quietly undoes a deliberate pin is worse than no
# job. Naming the input keeps this to the one that carries the apps.
#
# It still moves, and auto-merges, nixpkgs alone. When that bump does not
# evaluate, it may PROPOSE moving the inputs listed in data/pin-fix.nix -- the
# commit-pinned ones a nixpkgs bump is known to break -- as a DRAFT pull
# request that never merges itself (#1459). A person reads that draft, or a
# later night whose bump evaluates promotes it.

name: flake update

on:
  schedule:
    # 07:00 UTC, and the order is the point. nightly.yml (03:00) reports on
    # today's tree, omarchy.yml (04:00) and update.yml (05:00) each land their
    # own bump, and review.yml (06:00) rewrites the nightly review issue. This
    # runs last, so that issue records the staleness which motivated the bump
    # rather than being overwritten by it mid-run -- and so an Omarchy bump and
    # a nixpkgs bump are never two pull requests racing for the same base.
    #
    # 06:00 was the first choice and is taken twice over: review.yml every day
    # and build.yml on Mondays.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One bump at a time, and never cancelled. The loser of a cancelled race is a
# half-written lock file, and there is nothing to gain by starting over.
concurrency:
  group: flake-update
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-26.04
    # 45, not 30 (#1459): the gate evaluates every cached output (about 2 minutes)
    # and a refusal then tries each fixable input in turn. pin-fix.sh stops
    # trying at PIN_FIX_DEADLINE, so a draft still opens inside the budget.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix

      - name: What the apps are on today
        id: before
        run: |
          set -euo pipefail
          echo "PIN_FIX_DEADLINE=$(($(date +%s) + 28 * 60))" >> "$GITHUB_ENV"
          ./.github/scripts/app-versions.sh > /tmp/before.json
          echo "counted $(jq 'length' /tmp/before.json) apps on the current pin"

      - name: Move the pin
        id: bump
        run: |
          set -euo pipefail
          nix flake update nixpkgs
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "nixpkgs is already current -- nothing to do"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat -- flake.lock
            # pin-fix.sh measures every move from this tree, and restores from
            # it: restoring from git would drop the nixpkgs bump too.
            mkdir -p "$RUNNER_TEMP/base"
            cp flake.nix flake.lock "$RUNNER_TEMP/base/"
          fi

      - name: What the apps would be on
        id: after
        if: steps.bump.outputs.changed == 'true'
        run: |
          set -euo pipefail
          ./.github/scripts/app-versions.sh > /tmp/after.json
          echo "counted $(jq 'length' /tmp/after.json) apps on the new pin"

      # The point of the whole workflow, in a form a human can read in ten
      # seconds: which apps actually moved, and to what. A lock-file diff says
      # one hash became another hash, which tells a reviewer nothing about
      # whether this bump was worth taking.
      - name: What actually moved
        id: delta
        if: steps.bump.outputs.changed == 'true'
        run: |
          set -euo pipefail
          {
            echo "delta<<APPDELTA"
            jq -rn --slurpfile a /tmp/before.json --slurpfile b /tmp/after.json '
              ($a[0]) as $before | ($b[0]) as $after |
              [ $after | to_entries[]
                | select($before[.key] != null and $before[.key] != .value)
                | "| `\(.key)` | \($before[.key]) | \(.value) |" ]
              | if length == 0 then
                  "No package version changed -- the pin moved but nothing this repo installs did."
                else
                  (["| app | was | now |", "|---|---|---|"] + .) | join("\n")
                end'
            echo "APPDELTA"
          } >> "$GITHUB_OUTPUT"

          # Named in the title so the PR list is readable without opening it.
          n=$(jq -rn --slurpfile a /tmp/before.json --slurpfile b /tmp/after.json '
            ($a[0]) as $before | ($b[0]) as $after |
            [ $after | to_entries[]
              | select($before[.key] != null and $before[.key] != .value) ] | length')
          echo "count=$n" >> "$GITHUB_OUTPUT"

      # Cheap and decisive. #320 broke on exactly this surface: the flake
      # evaluated for the person who changed it and not for a user resolving
      # inputs fresh. drvPath forces the whole closure without building any of
      # it. It covers every output the binary cache holds plus the probe
      # target of each input in data/pin-fix.nix, not just the two toplevels:
      # on 2026-10-26 a bump broke every microvm runner, and a gate that
      # evaluated only the toplevels let the job refuse in silence while the
      # pin stayed broken (#1457, #1459).
      #
      # This is a FAST FAIL, not the gate. The gate is build.yml running on the
      # pull request below, which is why this job does not build anything: a
      # bump that only this job has verified is a bump verified by the same job
      # that proposes it.
      #
      # A bump that does not evaluate is this job's NORMAL outcome, not its
      # failure: upstream broke something, the canary caught it, and the right
      # move is to open a DRAFT that says so and try again tomorrow. So the
      # step records that and exits 0. A draft that stalls is the review's to
      # report (pkgs/review.sh, "nixpkgs bump").
      #
      # It used to exit 1, which made a working refusal indistinguishable from
      # a broken workflow -- both a red X on the same row of the nightly review
      # (#195). eval-gate.sh's exit 2 means the gate itself could not run, and
      # that one still fails the job.
      - name: Every cached output still evaluates
        id: gate
        if: steps.bump.outputs.changed == 'true'
        env:
          EVAL_GATE_LOG_DIR: ${{ runner.temp }}/eval-logs
        run: |
          set -euo pipefail
          rc=0
          ./.github/scripts/eval-gate.sh > "$RUNNER_TEMP/fail.tsv" || rc=$?
          case "$rc" in
            0)
              echo "ok=true" >> "$GITHUB_OUTPUT"
              echo "every cached output and probe evaluates against the new pin"
              ;;
            1)
              n=$(wc -l < "$RUNNER_TEMP/fail.tsv")
              echo "ok=false" >> "$GITHUB_OUTPUT"
              echo "count=$n" >> "$GITHUB_OUTPUT"
              echo "::warning::$n target(s) do not evaluate against the new pin; opening a draft"
              {
                echo "### nixpkgs bump does not evaluate"
                echo
                ./.github/scripts/pin-fix.sh --table < "$RUNNER_TEMP/fail.tsv"
                echo
                echo "This is the check doing its job -- nothing here is broken."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error::eval-gate.sh could not run (exit $rc); this is not an upstream break"
              exit 1
              ;;
          esac

      # Which of the pinned inputs, moved to their upstream default branch,
      # makes the batch evaluate again? Read-only API calls, so the default
      # token. The working tree ends as the bump alone, or the bump plus the
      # minimal moves. A pin-fix that crashes costs the proposal, not the
      # draft: fall back to the bump alone.
      - name: Try the allowlisted inputs
        id: pinfix
        if: steps.bump.outputs.changed == 'true' && steps.gate.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PIN_FIX_OUT: ${{ runner.temp }}/pinfix
        run: |
          set -euo pipefail
          if ! ./.github/scripts/pin-fix.sh "$RUNNER_TEMP/fail.tsv"; then
            echo "::warning::pin-fix did not finish; proposing nixpkgs alone"
            cp "$RUNNER_TEMP/base/flake.nix" "$RUNNER_TEMP/base/flake.lock" .
            mkdir -p "$PIN_FIX_OUT"
            echo unfixed > "$PIN_FIX_OUT/status"
            : > "$PIN_FIX_OUT/moved"
            echo "pin-fix did not finish; see the run log." > "$PIN_FIX_OUT/body.md"
          fi
          {
            echo "status=$(cat "$PIN_FIX_OUT/status")"
            echo "moved=$(paste -sd' ' "$PIN_FIX_OUT/moved")"
          } >> "$GITHUB_OUTPUT"

      # Who may write update/nixpkgs-blocked? Asked just before anything writes
      # to it, on both paths. A person (or Copilot) who has pushed to the
      # draft owns it from then on, and this job must not overwrite them. If
      # the question cannot be answered the job FAILS: a fail-safe that is
      # silent is a bump that stops, and nobody hears.
      - name: Who holds the blocked branch
        id: owner
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch=update/nixpkgs-blocked
          unreadable() {
            echo "::error::cannot read the state of $branch; refusing to write to it"
            echo "held cannot read the blocked branch's state" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          rc=0
          git ls-remote --exit-code --heads origin "$branch" > /dev/null || rc=$?
          case "$rc" in
            0) exists=true ;;
            2) exists=false ;;
            *) unreadable ;;
          esac
          pr=$(gh pr list --head "$branch" --state open --json number,isDraft,author,state \
            -q '.[0] // null | if . == null then null else {number, isDraft, author: .author.login, state} end') || unreadable
          commits='[]'
          if [ "$exists" = true ]; then
            commits=$(gh api "repos/$GH_REPO/compare/main...$branch" \
              --jq '[.commits[] | {message: .commit.message}]') || unreadable
          fi
          # Only an open PR needs judging by author. /user rejects the default
          # token, so asking it unconditionally would fail every night that
          # BUMP_TOKEN is missing, before any PR opened.
          bot=""
          if [ "$pr" != null ]; then
            bot=$(gh api user --jq .login) || unreadable
          fi
          jq -n --argjson e "$exists" --argjson pr "$pr" --argjson c "$commits" --arg bot "$bot" \
            '{branch_exists: $e, pr: $pr, commits: $c, bot: $bot}' > "$RUNNER_TEMP/owner.json"
          verdict=$(./.github/scripts/pin-fix.sh --owner "$RUNNER_TEMP/owner.json")
          echo "$verdict"
          kind=${verdict%% *}
          rest=${verdict#"$kind"}
          rest=${rest# }
          if [ "$kind" = writable ]; then
            writable=true
            held_pr=$rest
          else
            writable=false
            held_pr=$(jq -r '.pr.number // ""' "$RUNNER_TEMP/owner.json")
          fi
          {
            echo "writable=$writable"
            echo "pr=$held_pr"
            echo "reason=$rest"
          } >> "$GITHUB_OUTPUT"

      - name: Write the blocked draft's body
        if: steps.bump.outputs.changed == 'true' && steps.gate.outputs.ok == 'false' && steps.owner.outputs.writable == 'true'
        env:
          COUNT: ${{ steps.gate.outputs.count }}
          DELTA: ${{ steps.delta.outputs.delta }}
          PIN_FIX_OUT: ${{ runner.temp }}/pinfix
        run: |
          set -euo pipefail
          {
            echo "nixpkgs moves to the newest revision, but $COUNT target(s) do not evaluate against it."
            echo "So this is a **draft** and **will not merge itself**."
            echo
            echo "### Targets that fail"
            echo
            ./.github/scripts/pin-fix.sh --table < "$RUNNER_TEMP/fail.tsv"
            echo
            cat "$PIN_FIX_OUT/body.md"
            echo
            echo "### Apps that move with the pin"
            echo
            printf '%s\n' "$DELTA"
            echo
            echo "A later night whose bump evaluates promotes this pull request."
          } | ./.github/scripts/pin-fix.sh --sanitize > "$RUNNER_TEMP/blocked.body.md"

      - name: Open the blocked draft
        id: blocked
        if: steps.bump.outputs.changed == 'true' && steps.gate.outputs.ok == 'false' && steps.owner.outputs.writable == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.BUMP_TOKEN || github.token }}
          # Constant, not dated: one draft stays open and is updated by each
          # failing night, so its created date is when the stall began.
          branch: update/nixpkgs-blocked
          draft: always-true
          title: "${{ steps.pinfix.outputs.status == 'fixed' && format('nixpkgs: blocked on {0}, fix proposed', steps.pinfix.outputs.moved) || format('nixpkgs: blocked, {0} target(s) do not evaluate', steps.gate.outputs.count) }}"
          commit-message: |
            Move the nixpkgs pin, and with it ${{ steps.delta.outputs.count }} app version(s)

            Generated by .github/workflows/flake-update.yml.
          body-path: ${{ runner.temp }}/blocked.body.md
          labels: dependencies
          delete-branch: true

      # The branch belongs to somebody else tonight. Say what the bump
      # found, once per nixpkgs revision, and write nothing to the branch.
      - name: Say so on a draft somebody else holds
        if: steps.bump.outputs.changed == 'true' && steps.gate.outputs.ok == 'false' && steps.owner.outputs.writable == 'false'
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          HELD_PR: ${{ steps.owner.outputs.pr }}
          REASON: ${{ steps.owner.outputs.reason }}
        run: |
          set -euo pipefail
          rev=$(./.github/scripts/pin-fix.sh --nixpkgs-rev flake.lock)
          marker="<!-- flake-update:$rev -->"
          {
            echo "Tonight's nixpkgs bump ($rev) is blocked too, and this job did not write to the branch ($REASON)."
            echo
            ./.github/scripts/pin-fix.sh --table < "$RUNNER_TEMP/fail.tsv"
            echo
            echo "$marker"
          } | ./.github/scripts/pin-fix.sh --sanitize > "$RUNNER_TEMP/held.md"
          if gh pr view "$HELD_PR" --json comments -q '[.comments[].body]' | jq -e --arg m "$marker" 'any(.[]; contains($m))' > /dev/null; then
            echo "#$HELD_PR already carries a comment for $rev"
          else
            gh pr comment "$HELD_PR" --body-file "$RUNNER_TEMP/held.md"
          fi
          cat "$RUNNER_TEMP/held.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Write the bump's body
        if: steps.bump.outputs.changed == 'true' && steps.gate.outputs.ok == 'true'
        env:
          DELTA: ${{ steps.delta.outputs.delta }}
        run: |
          set -euo pipefail
          {
            echo 'Nightly bump of the `nixpkgs` input. Only that input: the others'
            echo 'are left where they are, because at least one of them is pinned on'
            echo 'purpose.'
            echo
            printf '%s\n' "$DELTA"
            echo
            cat <<'EOF'
          Verified before this PR was opened: every output the binary cache holds,
          and the probe target of each input in `data/pin-fix.nix`, evaluates
          (`.github/scripts/eval-gate.sh`).

          That is an evaluation check, not a build. **The gate is the CI on
          this pull request**, which runs because the PR was opened with
          `BUMP_TOKEN`; it merges when the required contexts report green and
          not before.

          What CI does not cover: an app that builds and then misbehaves at
          runtime. If a package here is one you rely on, launch it before
          this lands, or roll back afterwards with `nixos-rebuild --rollback`.
          EOF
          } | ./.github/scripts/pin-fix.sh --sanitize > "$RUNNER_TEMP/bump.body.md"

      # A clean night after a blocked one PROMOTES the draft: same branch, so
      # its history and comments stay. create-pull-request does not change a
      # PR's draft state on update, hence the explicit `gh pr ready` below.
      - name: Promote the blocked draft
        id: promote
        if: steps.bump.outputs.changed == 'true' && steps.gate.outputs.ok == 'true' && steps.owner.outputs.writable == 'true' && steps.owner.outputs.pr != ''
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.BUMP_TOKEN || github.token }}
          branch: update/nixpkgs-blocked
          draft: false
          title: "nixpkgs: ${{ steps.delta.outputs.count }} app version(s) move"
          commit-message: |
            Move the nixpkgs pin, and with it ${{ steps.delta.outputs.count }} app version(s)

            Generated by .github/workflows/flake-update.yml.
          body-path: ${{ runner.temp }}/bump.body.md
          labels: dependencies
          delete-branch: true

      # create-pull-request leaves the number empty when it had nothing to
      # push; the draft is still the one to promote, so fall back to it.
      - name: Mark the promoted draft ready
        id: ready
        if: steps.promote.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.promote.outputs.pull-request-number || steps.owner.outputs.pr }}
          SHA: ${{ steps.promote.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          [ -n "$SHA" ] || SHA=$(gh pr view "$PR" --json headRefOid --jq .headRefOid)
          { echo "pr=$PR"; echo "sha=$SHA"; } >> "$GITHUB_OUTPUT"
          if ! gh pr ready "$PR"; then
            echo "::error::could not mark #$PR ready for review; it stays a draft and will not merge"
            exit 1
          fi

      - name: Open a pull request
        id: pr
        if: steps.bump.outputs.changed == 'true' && steps.gate.outputs.ok == 'true' && !(steps.owner.outputs.writable == 'true' && steps.owner.outputs.pr != '')
        uses: peter-evans/create-pull-request@v8
        with:
          # A PR opened with the default GITHUB_TOKEN triggers no workflows at
          # all, so its required contexts never report and an armed auto-merge
          # waits forever. BUMP_TOKEN opens it under a real identity and the
          # checks run. Measured on 2026-09-05: a PR opened with BUMP_TOKEN
          # started six check runs within fifteen seconds; the same query
          # against a GITHUB_TOKEN-opened PR returned zero. Without the secret
          # this falls back and the merge step below fails saying precisely
          # that, rather than arming a merge that can never fire.
          token: ${{ secrets.BUMP_TOKEN || github.token }}
          # Dated, not constant. A bump that stops for a human -- an eval
          # break, a package that vanished from nixpkgs -- keeps its branch
          # while the next night still gets a clean attempt of its own.
          branch: update/nixpkgs-${{ github.run_id }}
          title: "nixpkgs: ${{ steps.delta.outputs.count }} app version(s) move"
          commit-message: |
            Move the nixpkgs pin, and with it ${{ steps.delta.outputs.count }} app version(s)

            Generated by .github/workflows/flake-update.yml.
          body-path: ${{ runner.temp }}/bump.body.md
          labels: dependencies
          delete-branch: true

      # A blocked draft somebody else holds, and tonight's bump is clean: it
      # opened as its own PR, and the draft's holder should know.
      - name: Tell the holder of the blocked draft
        if: steps.pr.outputs.pull-request-number && steps.owner.outputs.writable == 'false' && steps.owner.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          HELD_PR: ${{ steps.owner.outputs.pr }}
          NEW_PR: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          rev=$(./.github/scripts/pin-fix.sh --nixpkgs-rev flake.lock)
          marker="<!-- flake-update:$rev -->"
          if gh pr view "$HELD_PR" --json comments -q '[.comments[].body]' | jq -e --arg m "$marker" 'any(.[]; contains($m))' > /dev/null; then
            echo "#$HELD_PR already carries a comment for $rev"
          else
            gh pr comment "$HELD_PR" --body "A clean nixpkgs bump ($rev) opened as #$NEW_PR. This draft was left alone. $marker"
          fi

      - name: Arm auto-merge, gated on the required checks
        if: steps.ready.outputs.pr || steps.pr.outputs.pull-request-number
        env:
          # The PAT, not GITHUB_TOKEN: an auto-merge is performed as whoever
          # armed it, and a push by GITHUB_TOKEN runs no workflows. #671 merged
          # as github-actions and main's head got no build and no install check.
          GH_TOKEN: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.ready.outputs.pr || steps.pr.outputs.pull-request-number }}
          SHA: ${{ steps.ready.outputs.sha || steps.pr.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          pr=$PR
          sha=$SHA

          # Only nixpkgs may merge itself. The PR is judged by what it
          # contains, not by what this job meant to put in it: its lock must
          # equal main's apart from the root nixpkgs node, and flake.lock must
          # be the only file it changes. Anything else is a person's to merge.
          # Against the merge base, not main's tip: a merge that landed after
          # this bump was cut is not something the bump changes. The checkout
          # is shallow, so GitHub names the base and the files (three-dot).
          cmp=$(gh api "repos/$GH_REPO/compare/main...$sha")
          mb=$(jq -r .merge_base_commit.sha <<<"$cmp")
          files=$(jq -r '.files[].filename' <<<"$cmp")
          git fetch --no-tags --depth=1 origin "$mb" "$sha"
          git show "$mb:flake.lock" > "$RUNNER_TEMP/m.lock"
          git show "$sha:flake.lock" > "$RUNNER_TEMP/p.lock"
          if [ "$files" != "flake.lock" ] ||
            ! ./.github/scripts/pin-fix.sh --only-nixpkgs "$RUNNER_TEMP/m.lock" "$RUNNER_TEMP/p.lock"; then
            echo "::error::#$pr changes more than nixpkgs, so auto-merge is not armed." \
              "Files: $(echo "$files" | paste -sd' ')." \
              "Inputs moved: $(./.github/scripts/pin-fix.sh --moved "$RUNNER_TEMP/m.lock" "$RUNNER_TEMP/p.lock" | paste -sd' ')."
            exit 1
          fi

          # Needs "Allow auto-merge" (Settings -> General). If it is off, fail
          # here and say so: the PR is open and safe to merge by hand.
          if ! gh pr merge "$pr" --auto --squash --delete-branch; then
            echo "::error::could not arm auto-merge on #$pr -- most likely" \
              "'Allow auto-merge' is off in the repository settings. The PR" \
              "is open and waiting; merge it by hand once its checks pass."
            exit 1
          fi

          # Armed is not merged. Auto-merge waits for required contexts, which
          # exist only if opening the PR triggered the workflows. Left
          # undetected that is a bump which silently never lands: green job,
          # armed PR, checks that never arrive. Same guard as omarchy.yml, and
          # for the same reason. Asked of the sha judged above, not of a head
          # read afterwards.
          n=0
          for _ in 1 2 3 4 5 6; do
            sleep 20
            n=$(gh api "repos/$GH_REPO/commits/$sha/check-runs" --jq .total_count)
            [ "$n" -gt 0 ] && break
          done
          if [ "$n" -eq 0 ]; then
            echo "::error::no checks started on #$pr after two minutes. The PR" \
              "was opened with the default GITHUB_TOKEN, which triggers no" \
              "workflows, so auto-merge can never fire. Set the BUMP_TOKEN" \
              "secret. The PR is open; run the checks and merge it by hand."
            exit 1
          fi
          echo "auto-merge armed for the nixpkgs bump (#$pr, $n check runs under way)" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Say so when there was nothing to do
        if: steps.bump.outputs.changed != 'true'
        run: echo "nixpkgs was already current; no pull request opened" >> "$GITHUB_STEP_SUMMARY"
