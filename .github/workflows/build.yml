name: build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
      - uses: ./.github/actions/setup-nix
      - name: Build the exact candidate and its packaging checks
        run: |
          nix build -L --no-link \
            .#omarchy \
            .#checks.x86_64-linux.{install-phase-budget,panel-loaders,menu-conditions,menu-actions,bin-ledger,etc-overlay,user-migrations-ledger}
      - name: Validate the packaged command catalogue and README counts
        run: |
          tree=$(nix path-info .#omarchy)
          "$tree/bin/omarchy" commands --check
          OMARCHY_TREE="$tree" bash .github/scripts/readme-counts.sh --fix
          OMARCHY_TREE="$tree" bash .github/scripts/readme-counts.sh --check
