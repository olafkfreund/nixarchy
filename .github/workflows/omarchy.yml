name: omarchy

on:
  schedule:
    # Omarchy releases often. Daily, so a broken upstream is found while the
    # change is still small enough to read.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One bump at a time. There was no concurrency block here at all, so a
# workflow_dispatch during the 04:00 run raced the schedule for the same branch
# ref. cancel-in-progress is false because the loser would be a half-finished
# bump, and a bump that stops in the middle is worse than one that waits.
concurrency:
  group: omarchy-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    # 45, not the 20 this had. The session check below builds Hyprland, and
    # build.yml gives the same closure 30 minutes WITH the hyprland cache
    # configured; this job also builds .#omarchy from a source that just
    # changed, so it is guaranteed a cache miss on the way in. At 20 it was
    # killed twice, on 2026-08-31 and 09-01, at 20m21s and 20m24s -- and a
    # timeout is recorded as cancelled, not failed, so the report step below
    # never ran either. Two silent nights and a security release left on the
    # shelf.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v17
        with:
          name: nixarchy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Find the newest Omarchy release
        id: rel
        run: |
          latest=$(curl -fsSL https://api.github.com/repos/basecamp/omarchy/releases/latest |
            jq -r .tag_name)
          current=$(grep -oE 'github:basecamp/omarchy/[^"]+' flake.nix | cut -d/ -f3)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          # The version being left behind, for the package delta below.
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "$current -> $latest"
          [ "$current" = "$latest" ] && echo "changed=false" >> "$GITHUB_OUTPUT" ||
            echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Bump the input
        if: steps.rel.outputs.changed == 'true'
        run: |
          sed -i "s|github:basecamp/omarchy/[^\"]*|github:basecamp/omarchy/${{ steps.rel.outputs.latest }}|" flake.nix
          nix flake update omarchy

          # The tag is written in three places, and this used to move one of
          # them. omarchyVersion is what the package calls itself and what
          # omarchy-nvim defaults to, so an auto-merged bump left both naming
          # the version before it -- the store path said 4.0.1 while the tree
          # was 4.0.2. Rewritten here rather than reported later, because the
          # place to fix a stale copy is the thing that made it stale.
          ver="${{ steps.rel.outputs.latest }}"
          ver="${ver#v}"
          sed -i "s|omarchyVersion = \"[^\"]*\"|omarchyVersion = \"$ver\"|" flake.nix
          sed -i "s|omarchyVersion ? \"[^\"]*\"|omarchyVersion ? \"$ver\"|" \
            pkgs/omarchy-nvim/default.nix

      # Everything below is the same set of assertions build.yml makes, run
      # against the new Omarchy rather than the pinned one. Each answers a
      # different way upstream can break this port, and each has caught a real
      # break at least once:
      #
      #   - a bin we replace disappearing or being renamed
      #   - a substituteInPlace anchor changing under us (--replace-fail)
      #   - a menu row id we override no longer existing
      #   - a NEW app in the Install menu that data/apps.nix does not map,
      #     which would otherwise reach users as a row still calling pacman
      - name: Build against the new Omarchy
        if: steps.rel.outputs.changed == 'true'
        run: nix build .#omarchy --print-build-logs

      - name: What packages this release adds and drops
        if: steps.rel.outputs.changed == 'true'
        id: delta
        # Omarchy pins no versions -- its install lists are bare Arch names --
        # so the only thing to compare between releases is the set itself.
        # 4.0.2 is why this exists: it dropped cups-browsed and added
        # cups-pk-helper ("Harden CUPS printer discovery and administration"),
        # while modules/nixos.nix still justified its printing defaults with a
        # comment naming cups-browsed as being in base.packages. Three lines of
        # diff, pointing at a comment that had stopped being true.
        #
        # It goes in the PR body rather than the nightly review because it is
        # only worth reading while someone is deciding about this bump.
        run: |
          for tag in "${{ steps.rel.outputs.current }}" "${{ steps.rel.outputs.latest }}"; do
            : > "pkgs-$tag.txt"
            for list in omarchy-base omarchy-other; do
              curl -fsSL \
                "https://raw.githubusercontent.com/basecamp/omarchy/$tag/install/$list.packages" \
                >> "pkgs-$tag.txt" || true
            done
          done

          {
            echo "delta<<DELTA_EOF"
            bash .github/scripts/omarchy-package-delta.sh \
              "pkgs-${{ steps.rel.outputs.current }}.txt" \
              "pkgs-${{ steps.rel.outputs.latest }}.txt" \
              "${{ steps.rel.outputs.current }}" "${{ steps.rel.outputs.latest }}"
            echo "DELTA_EOF"
          } >> "$GITHUB_OUTPUT"

      # The next three steps are the rest of the briefing. Everything above
      # answers "does it still build here"; none of it answers "what did
      # upstream decide, and does any of it land on something we changed".
      # That was left to a human with 167 changed files and a git client.
      #
      # Everything below writes into $RUNNER_TEMP rather than the checkout.
      # create-pull-request stages the whole working tree, so a scratch file
      # left in the repo is a scratch file committed to the bump branch.
      #
      # All three are continue-on-error, and each writes a fallback line
      # rather than nothing when it cannot do its job. A briefing is worth
      # having and is worth nobody's bump: a GitHub API hiccup must not be the
      # reason a security release sits unadopted, which has already happened
      # here twice for other reasons. An empty section reads as "upstream
      # changed nothing", so a failed section has to say it failed.
      - name: What upstream says this release changed
        if: steps.rel.outputs.changed == 'true'
        continue-on-error: true
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Upstream's own words. A diff says what moved; only the release note
        # says why, and 4.0.2 is the case that proved the difference: the
        # package delta reported `cups-browsed` as "removed" and nothing more,
        # while the note called it "Harden CUPS printer discovery and
        # administration" -- which is what led to finding that nixarchy had
        # been running that daemon as root.
        #
        # Blockquoted, not pasted flat: upstream's headings would otherwise
        # outrank the PR body's own and the reader loses track of who is
        # speaking. The words are untouched.
        run: |
          tag="${{ steps.rel.outputs.latest }}"
          # A tag can exist with no release attached, and a release can exist
          # with an empty body. Both are silence, and silence in a PR body has
          # to say which kind it is -- an absent section reads as "upstream
          # said nothing", which is also what a broken API call reads as.
          body=$(gh api "repos/basecamp/omarchy/releases/tags/$tag" --jq '.body // ""' 2>/dev/null || true)
          {
            echo "notes<<NOTES_EOF"
            echo "### What upstream says about $tag"
            echo
            if [ -n "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
              printf '%s\n' "$body" | sed 's/^/> /'
            else
              echo "_No release notes: \`$tag\` has no GitHub release, or its release"
              echo "body is empty. Read the compare view instead._"
            fi
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: What this release changes in the tree seeded into ~/.config
        if: steps.rel.outputs.changed == 'true'
        continue-on-error: true
        id: config
        # modules/home.nix copies upstream's config/ into ~/.config verbatim,
        # so those 41 files reach a machine without passing through the
        # package or any check that reads it. #202 lived exactly there:
        # config/hypr/xdph.conf named `hyprland-preview-share-picker`, upstream
        # satisfies that from an Arch package list nothing on NixOS reads, and
        # screen sharing failed in every application with no dialog at all.
        run: |
          cur="${{ steps.rel.outputs.current }}"
          new="${{ steps.rel.outputs.latest }}"
          for tag in "$cur" "$new"; do
            mkdir -p "$RUNNER_TEMP/cfg-$tag"
            curl -fsSL "https://codeload.github.com/basecamp/omarchy/tar.gz/refs/tags/$tag" |
              tar xz -C "$RUNNER_TEMP/cfg-$tag" --strip-components=1 || true
          done

          {
            echo "config<<CONFIG_EOF"
            bash .github/scripts/omarchy-config-delta.sh \
              "$RUNNER_TEMP/cfg-$cur/config" "$RUNNER_TEMP/cfg-$new/config" \
              "$cur" "$new" ||
              echo "_The config delta could not run -- see the job log. This is" \
                "not a report that nothing changed._"
            echo "CONFIG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Which files this port patches upstream touched
        if: steps.rel.outputs.changed == 'true'
        continue-on-error: true
        id: patched
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The strongest of the three. 167 files changed in 4.0.2 and five of
        # them were files this port replaces with a stub -- including
        # omarchy-plymouth-set, where the upstream change was
        # "security/plymouth-publication-race (#8934)". A security fix landing
        # in a file we do not ship is fine, and is also a decision somebody
        # should make deliberately rather than never hear about.
        #
        # Two passes over the script because attribution needs a network and
        # the intersection does not: --list names the files, the loop asks
        # which commits IN THE RANGE touched each, and the second call renders
        # them. Restricted to the range on purpose -- the newest commit
        # touching a file is often years older than this release, and an
        # attribution that quietly cites it is worse than none.
        run: |
          cur="${{ steps.rel.outputs.current }}"
          new="${{ steps.rel.outputs.latest }}"
          cmp="repos/basecamp/omarchy/compare/$cur...$new"

          gh api "$cmp" --jq '.files[].filename' > "$RUNNER_TEMP/changed.txt" || true
          gh api "$cmp" --jq '.commits[].sha' | sort > "$RUNNER_TEMP/range.txt" || true

          # An empty compare is not "upstream changed nothing" -- upstream
          # changed something, that is why this job is running. It is a failed
          # fetch, and the script downstream would faithfully report "0 files
          # changed, none of them ours", which is the calm this whole briefing
          # exists to stop.
          if [ ! -s "$RUNNER_TEMP/changed.txt" ]; then
            {
              echo "patched<<PATCHED_EOF"
              echo "### Files this port patches that $new changed"
              echo
              echo "_The upstream compare could not be fetched -- see the job"
              echo "log. Nothing was checked; this is not a clean result._"
              echo "PATCHED_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          : > "$RUNNER_TEMP/attrib.txt"
          while IFS= read -r f; do
            gh api "repos/basecamp/omarchy/commits?sha=$new&path=$f&per_page=20" \
              --jq '.[] | .sha + "\t" + (.commit.message | split("\n")[0])' |
              while IFS="$(printf '\t')" read -r sha subject; do
                grep -qx "$sha" "$RUNNER_TEMP/range.txt" || continue
                printf '%s\t%s\n' "$f" "$subject"
              done >> "$RUNNER_TEMP/attrib.txt"
          done < <(bash .github/scripts/omarchy-patched-files.sh \
            --list "$RUNNER_TEMP/changed.txt" .)

          {
            echo "patched<<PATCHED_EOF"
            bash .github/scripts/omarchy-patched-files.sh \
              "$RUNNER_TEMP/changed.txt" . "$RUNNER_TEMP/attrib.txt" "$cur" "$new" ||
              echo "_The patched-file intersection could not run -- see the job" \
                "log. This is not a report that nothing this port touches moved._"
            echo "PATCHED_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check nothing became unmapped or unwired
        if: steps.rel.outputs.changed == 'true'
        run: |
          # The same script build.yml runs on every pull request, against the
          # newest Omarchy instead of the pinned one. It was an inline copy
          # here until that copy fell behind build.yml's -- it never learned
          # to look in data/services.nix, so it failed the v4.0.2 bump on
          # install.service.tailscale, which services.nix had mapped all
          # along. A security release sat unadopted for three days behind it.
          python3 .github/scripts/check-menu-mapping.py \
            result/share/omarchy/default/omarchy/omarchy-menu.jsonc \
            data/apps.nix data/services.nix

      # Booting the session builds the closure on the way, so there is no
      # separate closure step: it would double an hour-long Hyprland compile
      # to prove a strict subset of this.
      #
      # This is also the check that earns the auto-merge below. Everything
      # before it proves the tree assembles; this screenshots a running
      # desktop through qemu and compares the screen's average colour to the
      # wallpaper's own.
      #
      # Without it a green run meant very little: the desktop once rendered
      # pure black while every other check here passed, because a wallpaper
      # wider than GL_MAX_TEXTURE_SIZE draws nothing at all and Qt still
      # reports the image Ready.
      - name: Add hyprland binary cache
        if: steps.rel.outputs.changed == 'true'
        # Nixarchy pins Hyprland ahead of nixpkgs, so without this the runner
        # compiles a compositor from source. build.yml has had this since it
        # started building the same closure; this job never did, which is the
        # other half of why it kept running out of its budget.
        run: |
          sudo tee -a /etc/nix/nix.conf >/dev/null <<'EOF'
          extra-substituters = https://hyprland.cachix.org
          extra-trusted-public-keys = hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIITemDosxrE9/Kb+PfYvE=
          EOF
          sudo systemctl restart nix-daemon || true

      - name: Boot a session and check the desktop renders
        if: steps.rel.outputs.changed == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "$AGENT_TOOLSDIRECTORY"
          nix build .#checks.x86_64-linux.session --print-build-logs

      - name: Open a pull request
        if: steps.rel.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v8
        with:
          # The version is in the branch name, not just the title. With a
          # constant name, a bump that stops for a human -- a new app to map,
          # a moved anchor -- is overwritten by the next night's run, and the
          # state you were about to read is gone. Per version, the stuck one
          # waits where you left it while the next release still gets a clean
          # attempt of its own. delete-branch below keeps them from piling up.
          branch: update/omarchy-${{ steps.rel.outputs.latest }}
          title: "Omarchy ${{ steps.rel.outputs.latest }}"
          commit-message: "Omarchy ${{ steps.rel.outputs.latest }}"
          body: |
            Bumps the vendored Omarchy to `${{ steps.rel.outputs.latest }}`.

            Merged automatically because every check passed:

            - the vendored tree builds
            - every bin this port replaces is still present
            - every `substituteInPlace` anchor still matches
            - every menu row it overrides still exists
            - all Install rows are still mapped in `data/apps.nix`
            - **a booted session renders its wallpaper**

            ${{ steps.notes.outputs.notes }}

            ${{ steps.delta.outputs.delta }}

            ${{ steps.config.outputs.config }}

            ${{ steps.patched.outputs.patched }}

            If something is wrong anyway, roll back with
            `nixos-rebuild --rollback` or the boot menu, and open an issue.
          labels: dependencies
          delete-branch: true

      # Auto-merge only because the session check above actually boots the
      # desktop. Reaching this step already means every check passed -- a
      # failure anywhere above fails the job and never gets here.
      - name: Merge it
        if: steps.rel.outputs.changed == 'true' && steps.pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.pr.outputs.pull-request-number }} \
            --squash --delete-branch --admin
          echo "merged Omarchy ${{ steps.rel.outputs.latest }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Report what needs a human
        # cancelled() as well as failure(): the timeout that killed this job
        # twice reports as cancelled, and a report step that only fires on
        # failure() is silent for exactly the case nobody is watching.
        #
        # And no `changed` guard. It was there to keep quiet on the nights
        # with nothing to do, but a failure in the release probe itself leaves
        # `changed` unset, so the guard turned the one unexplained failure
        # into no report at all.
        if: failure() || cancelled()
        run: |
          echo "Omarchy ${{ steps.rel.outputs.latest }} needs manual work." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Most likely one of:" >> "$GITHUB_STEP_SUMMARY"
          echo "- a new app in the Install menu -> add it to data/apps.nix" >> "$GITHUB_STEP_SUMMARY"
          echo "- a renamed bin -> pkgs/omarchy/nix-bin/" >> "$GITHUB_STEP_SUMMARY"
          echo "- a changed substituteInPlace anchor -> pkgs/omarchy/default.nix" >> "$GITHUB_STEP_SUMMARY"
          echo "- a menu row id that no longer exists -> modules/apps.nix" >> "$GITHUB_STEP_SUMMARY"
