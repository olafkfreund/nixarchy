name: omarchy-edge

# Publishes the `edge` branch: main, plus Omarchy's `quattro` branch pinned by
# commit, plus the carry commits that make quattro build (#1278).
#
# Users on the edge channel follow `edge`, so it only ever fast-forwards and
# only ever moves to a commit whose gates passed. The work happens on a scratch
# ref, `edge-candidate`; edge-promote.sh is the one thing that moves `edge`.
#
#   prepare    merge main, pin quattro, build, brief    (hosted)
#   wait-idle  wait until no install is booting VMs     (hosted)
#   verify     boot the VM checks, then promote         (self-hosted)
#   report     one rolling issue labelled omarchy-edge  (hosted)
#
# Nothing here pushes to cachix: the free tier is full of what users download,
# and edge closures are not that (CLAUDE.md section 6).

on:
  schedule:
    # After omarchy.yml's 04:00 release bump, so a merged bump is in this run.
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      from_candidate:
        description: "Start from edge-candidate instead of edge (after resolving a merge conflict by hand)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  # wait-idle reads runs and jobs to see whether an install is running.
  actions: read

# A newer run replaces an older one: only the current main and quattro matter,
# and a half-finished candidate is a scratch ref nobody follows.
concurrency:
  group: omarchy-edge
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-26.04
    # Two cold build passes when quattro is red and the fallback runs (#1383).
    timeout-minutes: 90
    outputs:
      skip: ${{ steps.pin.outputs.skip }}
      expected: ${{ steps.start.outputs.expected }}
      candidate: ${{ steps.candidate.outputs.sha }}
      fallback: ${{ steps.build2.outcome == 'success' }}
      failed: ${{ steps.build.outputs.failed || steps.candidate.outputs.failed || steps.pin.outputs.failed || steps.merge.outputs.failed || steps.start.outputs.failed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # GITHUB_TOKEN cannot push a commit that changes .github/workflows,
          # and merging main brings every workflow edit along. A token with
          # the workflows scope goes in NIXARCHY_EDGE_TOKEN; without one, a
          # main that moved a workflow fails the candidate push loudly.
          token: ${{ secrets.NIXARCHY_EDGE_TOKEN || github.token }}
      - uses: ./.github/actions/setup-nix
      - uses: cachix/cachix-action@v17
        # A cache upload failing must not fail a build that succeeded (#235).
        continue-on-error: true
        with:
          # Pull only. What reaches the cache is pushed by name, from main, by
          # cachix-push.sh -- the store diff filled the free tier (#697).
          skipPush: true
          # Why: .github/actions/setup-nix/action.yml -- `cachix use` would replace its substituters.
          skipAddingSubstituter: true
          name: nixarchy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Choose where to start
        id: start
        env:
          FROM_CANDIDATE: ${{ inputs.from_candidate }}
        run: |
          set -euo pipefail
          trap 'echo "failed=start" >> "$GITHUB_OUTPUT"' ERR
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Captured first, then split: a failed ls-remote must not read as a
          # branch that does not exist.
          listing=$(git ls-remote origin refs/heads/edge)
          expected=${listing%%$'\t'*}
          [ -n "$expected" ] || expected=none
          listing=$(git ls-remote origin refs/heads/edge-candidate)
          have_candidate=${listing%%$'\t'*}

          # The first publish starts from edge-candidate when there is one: that
          # is where the seeded carry commits live. Otherwise from_candidate is
          # the way back in after a merge conflict was resolved by hand.
          if [ "$FROM_CANDIDATE" = true ] && [ -z "$have_candidate" ]; then
            echo "::error::from_candidate was set but there is no edge-candidate branch"
            exit 1
          fi
          if [ -n "$have_candidate" ] && { [ "$FROM_CANDIDATE" = true ] || [ "$expected" = none ]; }; then
            start=origin/edge-candidate
          elif [ "$expected" != none ]; then
            start=origin/edge
          else
            start=origin/main
          fi
          echo "expected=$expected" >> "$GITHUB_OUTPUT"
          echo "start=$start" >> "$GITHUB_OUTPUT"
          git switch -q -C candidate "$start"

          # Read BEFORE the merge: the skip rule asks what edge already has.
          have=$(grep -oE 'github:basecamp/omarchy/[0-9a-f]{40}' flake.nix | cut -d/ -f3 || true)
          echo "have=$have" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "main_in=true" >> "$GITHUB_OUTPUT"
          else
            echo "main_in=false" >> "$GITHUB_OUTPUT"
          fi
          echo "starting from $start (expected edge head: $expected)"

      - name: Merge main
        id: merge
        env:
          MAIN_IN: ${{ steps.start.outputs.main_in }}
        run: |
          set -uo pipefail
          fail() {
            echo "failed=$1" >> "$GITHUB_OUTPUT"
            echo "::error::$2"
            exit 1
          }

          if [ "$MAIN_IN" != true ]; then
            # omarchy.yml rewrites the Omarchy url, omarchyVersion and the
            # omarchy node of flake.lock on main; edge rewrote the same lines,
            # so every Omarchy bump would conflict. Put edge's pin back to what
            # it was where the histories split, so that only main changes those
            # lines. The pin step re-pins and re-locks afterwards.
            #
            # This assumes edge's flake.lock differs from main's only in the
            # omarchy node. A carry commit that adds a flake INPUT breaks that,
            # and the merge then conflicts on flake.lock -- loudly, which is the
            # right failure.
            base=$(git merge-base HEAD origin/main) || fail merge-base "no merge base between edge and main"
            old_url=$(git show "$base:flake.nix" | sed -nE 's|.*github:basecamp/omarchy/([^"]*)".*|\1|p' | head -1)
            old_ver=$(git show "$base:flake.nix" | sed -nE 's|.*omarchyVersion = "([^"]*)".*|\1|p' | head -1)
            [ -n "$old_url" ] && [ -n "$old_ver" ] || fail unpin "could not read the Omarchy pin at the merge base $base"
            sed -i "s|github:basecamp/omarchy/[^\"]*|github:basecamp/omarchy/$old_url|" flake.nix
            sed -i "s|omarchyVersion = \"[^\"]*\"|omarchyVersion = \"$old_ver\"|" flake.nix
            git restore --source="$base" -- flake.lock
            git add flake.nix flake.lock
            git diff --cached --quiet || git commit -q -m "Edge: unpin Omarchy before merging main"
          fi

          # A merge, never a rebase: edge only fast-forwards, and a rebase would
          # rewrite commits users' locks already name.
          if ! git merge --no-edit origin/main; then
            files=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            echo "::error::merging main into edge conflicts in: $files"
            echo "::error::the next run starts from origin/edge again, so it will conflict again."
            echo "::error::resolve the merge on a branch off edge, push that branch to edge-candidate,"
            echo "::error::then re-run this workflow with from_candidate=true."
            fail "merge-conflict: $files" "merge of main failed"
          fi

      - name: Find the newest quattro commit
        id: pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAVE: ${{ steps.start.outputs.have }}
          MAIN_IN: ${{ steps.start.outputs.main_in }}
          START: ${{ steps.start.outputs.start }}
          EXPECTED: ${{ steps.start.outputs.expected }}
          FROM_CANDIDATE: ${{ inputs.from_candidate }}
        run: |
          set -euo pipefail
          # Authenticated, and refuses anything but a full SHA: a 403 once made
          # the answer empty and the sed pinned upstream's default branch
          # (omarchy.yml). The SHA is pasted into later steps' shell, so the
          # 40-hex test is also what makes that safe.
          if [ "$FROM_CANDIDATE" = true ] && [[ $HAVE =~ ^[0-9a-f]{40}$ ]]; then
            sha=$HAVE # carry main to the candidate's quattro; a scheduled run moves quattro
          else
            sha=$(gh api repos/basecamp/omarchy/commits/quattro --jq .sha) ||
              { echo "failed=quattro-sha" >> "$GITHUB_OUTPUT"; exit 1; }
          fi
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "failed=quattro-sha" >> "$GITHUB_OUTPUT"
            echo "::error::no commit SHA from the API for quattro: '$sha'"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

          # Only when edge exists and we started from it: a candidate that was
          # never promoted has not been published, however current it looks.
          if [ "$START" = origin/edge ] && [ "$EXPECTED" != none ] && [ "$sha" = "$HAVE" ] && [ "$MAIN_IN" = true ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "edge already has quattro $sha and all of main; nothing to do" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

          ver="edge-$(date -u +%Y%m%d)-${sha:0:7}"
          sed -i "s|github:basecamp/omarchy/[^\"]*|github:basecamp/omarchy/$sha|" flake.nix
          sed -i "s|omarchyVersion = \"[^\"]*\"|omarchyVersion = \"$ver\"|" flake.nix

          # Prove the two copies agree rather than trusting two seds: a sed that
          # matches nothing exits 0 (the same proof omarchy.yml makes).
          url_sha=$(sed -nE 's|.*github:basecamp/omarchy/([0-9a-f]{40})".*|\1|p' flake.nix | head -1)
          lit_ver=$(sed -nE 's|.*omarchyVersion = "([^"]*)".*|\1|p' flake.nix | head -1)
          if [ "$url_sha" != "$sha" ] || [ "$lit_ver" != "$ver" ]; then
            echo "failed=pin-copies-disagree" >> "$GITHUB_OUTPUT"
            echo "::error::version copies disagree after the pin:"
            echo "::error::  input url  $url_sha (wanted $sha)"
            echo "::error::  literal    $lit_ver (wanted $ver)"
            exit 1
          fi
          nix flake update omarchy || { echo "failed=flake-update" >> "$GITHUB_OUTPUT"; exit 1; }
          echo "omarchy quattro $sha as $ver, and both copies in flake.nix agree" | tee -a "$GITHUB_STEP_SUMMARY"

      # Each build on its own, and the step fails at the end naming every red
      # one. One evaluation error kills a batched `nix build`, and the siblings
      # then report "no result" having never run -- a green that proves nothing
      # (CLAUDE.md section 13).
      - name: Build, and the cheap checks, each separately
        id: build
        if: steps.pin.outputs.skip != 'true'
        # A red new quattro falls back to edge's last good pin in this same run (#1383).
        continue-on-error: true
        run: bash .github/scripts/edge-build.sh

      - name: Find the pin edge already publishes
        id: good
        if: steps.build.outcome == 'failure' && steps.pin.outputs.skip != 'true'
        env:
          NEW: ${{ steps.pin.outputs.sha }}
        run: |
          set -uo pipefail
          # Captured first: a missing origin/edge must read as "no fallback".
          flake=$(git show origin/edge:flake.nix 2>/dev/null) || flake=""
          good=$(grep -oE 'github:basecamp/omarchy/[0-9a-f]{40}' <<<"$flake" | cut -d/ -f3 || true)
          if [ -n "$good" ] && [ "$good" != "$NEW" ]; then
            echo "sha=$good" >> "$GITHUB_OUTPUT"
          else
            echo "no earlier pin to fall back to (edge has '${good:-none}')"
          fi

      - name: Pin the last good quattro
        id: pin2
        if: steps.good.outputs.sha != ''
        env:
          SHA: ${{ steps.good.outputs.sha }}
        run: |
          set -euo pipefail
          ver="edge-$(date -u +%Y%m%d)-${SHA:0:7}"
          sed -i "s|github:basecamp/omarchy/[^\"]*|github:basecamp/omarchy/$SHA|" flake.nix
          sed -i "s|omarchyVersion = \"[^\"]*\"|omarchyVersion = \"$ver\"|" flake.nix
          url_sha=$(sed -nE 's|.*github:basecamp/omarchy/([0-9a-f]{40})".*|\1|p' flake.nix | head -1)
          lit_ver=$(sed -nE 's|.*omarchyVersion = "([^"]*)".*|\1|p' flake.nix | head -1)
          [ "$url_sha" = "$SHA" ] && [ "$lit_ver" = "$ver" ] ||
            { echo "::error::fallback pin did not apply: '$url_sha' '$lit_ver'"; exit 1; }
          nix flake update omarchy
          echo "quattro was red; falling back to the pin edge has: $SHA" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build the fallback pin
        id: build2
        if: steps.pin2.outcome == 'success'
        run: bash .github/scripts/edge-build.sh

      # The briefing: what quattro changed that this port cares about, against
      # the Omarchy that `release` ships. Each step is continue-on-error and
      # writes a fallback line rather than nothing, because an empty section
      # reads as "nothing changed" -- the same rule omarchy.yml states.
      - name: Briefing - what packages edge adds and drops
        if: ${{ !cancelled() && steps.pin.outputs.skip == 'false' }}
        continue-on-error: true
        env:
          NEW: ${{ steps.pin.outputs.sha }}
        run: |
          set -uo pipefail
          rel=$(git show origin/release:flake.nix 2>/dev/null | grep -oE 'github:basecamp/omarchy/[^"]+' | head -1 | cut -d/ -f3 || true)
          {
            echo "### Packages: release ${rel:-?} -> quattro ${NEW:0:7}"
            if [ -z "$rel" ]; then
              echo "_release's Omarchy pin could not be read -- this is not a clean result._"
            else
              for r in "$rel" "$NEW"; do
                : > "$RUNNER_TEMP/pkgs-$r.txt"
                for list in omarchy-base omarchy-other; do
                  curl -fsSL "https://raw.githubusercontent.com/basecamp/omarchy/$r/install/$list.packages" \
                    >> "$RUNNER_TEMP/pkgs-$r.txt" || true
                done
              done
              bash .github/scripts/omarchy-package-delta.sh \
                "$RUNNER_TEMP/pkgs-$rel.txt" "$RUNNER_TEMP/pkgs-$NEW.txt" "$rel" "${NEW:0:7}" ||
                echo "_The package delta could not run -- see the job log. This is not a report that nothing changed._"
            fi
          } > "$RUNNER_TEMP/delta.md"
          cat "$RUNNER_TEMP/delta.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Briefing - what edge changes in the seeded ~/.config tree
        if: ${{ !cancelled() && steps.pin.outputs.skip == 'false' }}
        continue-on-error: true
        env:
          NEW: ${{ steps.pin.outputs.sha }}
        run: |
          set -uo pipefail
          rel=$(git show origin/release:flake.nix 2>/dev/null | grep -oE 'github:basecamp/omarchy/[^"]+' | head -1 | cut -d/ -f3 || true)
          {
            if [ -z "$rel" ]; then
              echo "### Config: release's Omarchy pin could not be read"
              echo "_This is not a clean result._"
            else
              for r in "$rel" "$NEW"; do
                mkdir -p "$RUNNER_TEMP/cfg-$r"
                curl -fsSL "https://codeload.github.com/basecamp/omarchy/tar.gz/$r" |
                  tar xz -C "$RUNNER_TEMP/cfg-$r" --strip-components=1 || true
              done
              bash .github/scripts/omarchy-config-delta.sh \
                "$RUNNER_TEMP/cfg-$rel/config" "$RUNNER_TEMP/cfg-$NEW/config" "$rel" "${NEW:0:7}" ||
                echo "_The config delta could not run -- see the job log. This is not a report that nothing changed._"
            fi
          } > "$RUNNER_TEMP/config.md"
          cat "$RUNNER_TEMP/config.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Briefing - which files this port patches that edge touched
        if: ${{ !cancelled() && steps.pin.outputs.skip == 'false' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW: ${{ steps.pin.outputs.sha }}
        run: |
          set -uo pipefail
          rel=$(git show origin/release:flake.nix 2>/dev/null | grep -oE 'github:basecamp/omarchy/[^"]+' | head -1 | cut -d/ -f3 || true)
          cmp="repos/basecamp/omarchy/compare/$rel...$NEW"
          : > "$RUNNER_TEMP/changed.txt"
          [ -z "$rel" ] || gh api "$cmp" --jq '.files[].filename' > "$RUNNER_TEMP/changed.txt" || true
          gh api "$cmp" --jq '.commits[].sha' 2>/dev/null | sort > "$RUNNER_TEMP/range.txt" || true
          {
            # An empty compare is a failed fetch, not "upstream changed nothing".
            if [ ! -s "$RUNNER_TEMP/changed.txt" ]; then
              echo "### Files this port patches that quattro changed"
              echo "_The upstream compare could not be fetched -- nothing was checked; this is not a clean result._"
            else
              : > "$RUNNER_TEMP/attrib.txt"
              while IFS= read -r f; do
                gh api "repos/basecamp/omarchy/commits?sha=$NEW&path=$f&per_page=20" \
                  --jq '.[] | .sha + "\t" + (.commit.message | split("\n")[0])' |
                  while IFS="$(printf '\t')" read -r csha subject; do
                    grep -qx "$csha" "$RUNNER_TEMP/range.txt" || continue
                    printf '%s\t%s\n' "$f" "$subject"
                  done >> "$RUNNER_TEMP/attrib.txt"
              done < <(bash .github/scripts/omarchy-patched-files.sh --list "$RUNNER_TEMP/changed.txt" .)
              bash .github/scripts/omarchy-patched-files.sh \
                "$RUNNER_TEMP/changed.txt" . "$RUNNER_TEMP/attrib.txt" "$rel" "${NEW:0:7}" ||
                echo "_The patched-file intersection could not run -- see the job log. This is not a report that nothing moved._"
            fi
          } > "$RUNNER_TEMP/patched.md"
          cat "$RUNNER_TEMP/patched.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the candidate
        id: candidate
        if: steps.pin.outputs.skip != 'true' && (steps.build.outcome == 'success' || steps.build2.outcome == 'success')
        env:
          SHA: ${{ steps.build2.outcome == 'success' && steps.good.outputs.sha || steps.pin.outputs.sha }}
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --quiet || git commit -q -m "Edge: Omarchy quattro ${SHA:0:7} on main $(git rev-parse --short=7 origin/main)"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # --force, and only here: edge-candidate is a scratch ref that nobody
          # follows, rewritten every run. `edge` itself is never forced.
          git push --force origin HEAD:refs/heads/edge-candidate || {
            echo "failed=candidate-push" >> "$GITHUB_OUTPUT"
            echo "::error::could not push edge-candidate. If main changed a file under .github/workflows,"
            echo "::error::GITHUB_TOKEN cannot push it: add a token with the workflows scope as NIXARCHY_EDGE_TOKEN"
            exit 1
          }

      - name: Fail when no build passed
        if: steps.pin.outputs.skip != 'true' && steps.build.outcome == 'failure' && steps.build2.outcome != 'success'
        run: |
          echo "::error::quattro is red and there is no earlier pin that builds; nothing was published"
          exit 1

      # What failed, last, where a reader of the log ends up (#1384). Reads the
      # log build-unless-proven.sh keeps; never changes this job's status.
      - name: Failure digest
        id: digest
        if: failure()
        continue-on-error: true
        run: .github/scripts/failure-digest.sh

  # Its own hosted job: three hours of sleeping must not hold a VM runner.
  wait-idle:
    needs: prepare
    if: needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      # What edge's VMs must not share p620 with is an install's VMs (#1365).
      # Package builds, docs and Pages runs are not waited for (#1426).
      # Exit 2 (unknown) counts as busy, so a broken API ends at the bound.
      - name: Wait until no install is booting VMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          deadline=$((SECONDS + 10800))
          while :; do
            rc=0
            what=$(.github/scripts/vm-host-free.sh edge 2>&1) || rc=$?
            [ "$rc" = 0 ] && { echo "$what"; break; }
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::gave up after 3 hours waiting on: $what"
              exit 1
            fi
            echo "waiting ($(( (deadline - SECONDS) / 60 )) min left): $what"
            sleep 60
          done

  verify:
    needs: [prepare, wait-idle]
    if: needs.prepare.result == 'success' && needs.prepare.outputs.skip != 'true'
    # The VM runners, labels as install-check.yml's `runner` output gives them.
    runs-on: [self-hosted, nixos, kvm, big]
    # Three VM builds, each ~10-20 minutes warm; the wait is in wait-idle.
    timeout-minutes: 240
    outputs:
      failed: ${{ steps.vms.outputs.failed }}
      promoted: ${{ steps.promote.outputs.promoted }}
    steps:
      # The candidate SHA, not the branch: what is booted is exactly what is
      # promoted, even if edge-candidate is rewritten meanwhile.
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.candidate }}
          fetch-depth: 0
          # The promote pushes edge: same token rule as prepare.
          token: ${{ secrets.NIXARCHY_EDGE_TOKEN || github.token }}

      - name: Evaluate options, then boot the VM checks, each separately
        id: vms
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Keep a copy for the Failure digest step (#1384); not `| tee`, which
          # would need pipefail on every build.
          exec > >(tee -a "${RUNNER_TEMP:-/tmp}/build.log") 2>&1
          failed=""
          # An install check's VMs and these must not share the host (#1365).
          # Exit 2 (unknown) counts as busy; the bound is per check.
          host_free() {
            local deadline=$((SECONDS + 7200)) what rc
            while :; do
              rc=0
              what=$(nix shell nixpkgs#gh nixpkgs#jq -c .github/scripts/vm-host-free.sh edge 2>&1) || rc=$?
              [ "$rc" = 0 ] && return 0
              echo "waiting ($(( (deadline - SECONDS) / 60 )) min left): $what"
              [ "$SECONDS" -lt "$deadline" ] || { echo "::error::gave up after 120 min waiting on: $what"; return 1; }
              sleep 60
            done
          }
          for c in options session coexist plugin; do
            if [ "$c" != options ] && ! host_free; then
              echo "::error::$c failed: the host never freed up"
              failed="$failed $c"
              continue
            fi
            echo "::group::$c"
            if nix build ".#checks.x86_64-linux.$c" --print-build-logs; then echo "::endgroup::"; else
              echo "::endgroup::"
              echo "::error::$c failed"
              failed="$failed $c"
            fi
          done
          echo "failed=${failed# }" >> "$GITHUB_OUTPUT"
          [ -z "$failed" ] || { echo "::error::red:$failed"; exit 1; }

      - name: Promote the candidate to edge
        id: promote
        env:
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          EXPECTED: ${{ needs.prepare.outputs.expected }}
        run: |
          set -euo pipefail
          bash .github/scripts/edge-promote.sh origin "$CANDIDATE" "$EXPECTED"
          echo "promoted=true" >> "$GITHUB_OUTPUT"
          echo "edge is now $CANDIDATE" >> "$GITHUB_STEP_SUMMARY"

      # What failed, last, where a reader of the log ends up (#1384). Reads the
      # log build-unless-proven.sh keeps; never changes this job's status.
      - name: Failure digest
        id: digest
        if: failure()
        continue-on-error: true
        run: .github/scripts/failure-digest.sh

  # One rolling issue. No continue-on-error anywhere in this job: if it cannot
  # read or write the issue it must fail the run, or a broken edge fails
  # nightly in silence (CLAUDE.md section 4).
  report:
    needs: [prepare, wait-idle, verify]
    # Not always(): that would also run after a cancel, and a superseded run
    # would file a failure. A job that TIMED OUT still reports cancelled as its
    # result, and !cancelled() runs for it, so it is treated as a failure below.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Update the omarchy-edge issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PREPARE: ${{ needs.prepare.result }}
          WAIT: ${{ needs.wait-idle.result }}
          VERIFY: ${{ needs.verify.result }}
          CANDIDATE: ${{ needs.prepare.outputs.candidate }}
          SKIP: ${{ needs.prepare.outputs.skip }}
          PREPARE_FAILED: ${{ needs.prepare.outputs.failed }}
          VERIFY_FAILED: ${{ needs.verify.outputs.failed }}
          PROMOTED: ${{ needs.verify.outputs.promoted }}
          FALLBACK: ${{ needs.prepare.outputs.fallback }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # A plain variable, never `read` into fields: --jq renders null as
          # nothing, and a whitespace IFS drops the empty field (section 13).
          num=$(gh issue list --label omarchy-edge --state open --json number,title \
            --jq '[.[] | select(.title == "The Omarchy edge channel is not publishing")][0].number // empty')

          # A cancel after edge-promote pushed but before it wrote promoted=true
          # would report a failure for a promoted edge. Ask the remote.
          if [ "$PROMOTED" != true ] && [ -n "$CANDIDATE" ] && [ "$VERIFY" != success ]; then
            current=$(gh api "repos/$GH_REPO/git/ref/heads/edge" --jq .object.sha 2>/dev/null || true)
            [ "$current" != "$CANDIDATE" ] || PROMOTED=true
          fi

          # A promotion on the fallback pin must not hide that new quattro is red.
          if [ "$PROMOTED" = true ] && [ "$FALLBACK" != true ]; then
            if [ -n "$num" ]; then
              gh issue close "$num" --comment "edge was promoted by $RUN_URL"
            fi
            echo "promoted; issue ${num:-none open}"
            exit 0
          fi
          if [ "$PREPARE" = success ] && [ "$SKIP" = true ]; then
            echo "edge is current; nothing to report"
            exit 0
          fi

          # A cancelled job result here is a timeout, not a person: a cancelled
          # workflow does not reach this job.
          if [ "$PROMOTED" = true ]; then
            sig="quattro red, edge kept on its last good pin: ${PREPARE_FAILED:-unknown}"
          elif [ "$PREPARE" != success ]; then
            sig="prepare: ${PREPARE_FAILED:-$PREPARE}"
          elif [ "$WAIT" != success ]; then
            sig="wait-idle: $WAIT"
          elif [ "$VERIFY" != success ]; then
            sig="verify: ${VERIFY_FAILED:-$VERIFY}"
          else
            sig="promote: not promoted"
          fi
          body=$(printf '%s\n\n%s\n' "edge-sig: $sig" "Run: $RUN_URL")

          gh label create omarchy-edge --force \
            --description "The nightly edge publish is failing" --color d93f0b
          if [ -z "$num" ]; then
            gh issue create --label omarchy-edge \
              --title "The Omarchy edge channel is not publishing" --body "$body"
            exit 0
          fi

          # Comment only when the failure changed: the same red every night is
          # one comment, not thirty.
          last=$(gh issue view "$num" --json body,comments \
            --jq '((.comments | last) // {body: .body}).body // "" | split("\n")[0]')
          if [ "$last" = "edge-sig: $sig" ]; then
            echo "same failure as the last comment ($sig); not commenting"
          else
            gh issue comment "$num" --body "$body"
          fi
