name: build
permissions:
  contents: read
  pull-requests: read
  issues: read
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # A weekly re-run against the COMMITTED lock. This used to claim it
    # caught a break "before someone else's `nix flake update` does", and it
    # cannot: the lock pins every flake input, so on those it proves nothing
    # the last merged PR did not already prove. #320 is the measurement --
    # nixpkgs renamed ffmpeg_7 away, every downstream consumer broke, and
    # this run stayed green because its lock still held the old nixpkgs.
    # nightly.yml's canary job is the one that resolves the inputs the way a
    # user's update would.
    #
    # What this run DOES watch is everything the checks reach past the lock
    # for: the live issue list the roadmap check reads, and the fetched
    # upstream artefacts. Those move on their own schedule, so a scheduled run
    # is what notices -- and the roadmap check now runs ONLY here and on
    # pushes to main, because a pull request cannot be responsible for an issue
    # somebody closed while it was open.
    #
    # "the registry nixpkgs that every mapped app still evaluates asks" used to
    # be on this list and is not any more: that check resolves `nixpkgs#`
    # through --inputs-from . now, so it reads this repository's pin and moves
    # only when the lock does.
    - cron: "0 6 * * 1"
concurrency:
  # Per COMMIT on main, per branch everywhere else.
  #
  # `cancel-in-progress: false` was not enough, and the reason is a separate
  # GitHub rule the flag does not touch: only one run per group may be
  # PENDING, and "any previously pending job or workflow in the concurrency
  # group will be canceled" when a newer one queues. So with one run building
  # and merges arriving behind it, run 2 is cancelled by run 3, run 3 by run
  # 4, and only the first and last of a burst ever report.
  #
  # That is the data loss the note below describes, still happening after the
  # fix written for it: five consecutive merges left main with no `box` result
  # at all. A shared group cannot express "keep every one of these" -- so on
  # main the SHA joins the group and each merged commit gets a group of its
  # own, which nothing can supersede.
  #
  # On a PR branch the old behaviour is right and is kept: a newer push really
  # does supersede the older one, and cancelling saves a runner.
  #
  # The cost, stated: a burst of merges to main now runs concurrently rather
  # than serially, so the self-hosted queue can grow. That is the trade being
  # made deliberately -- a verdict nobody gets is worth less than a runner
  # minute, and every push to main is a different merged commit that nothing
  # will ever re-test.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{


      github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  # Can this change affect anything Nix builds?
  #
  # Same question install-check.yml has asked since #183, same script, and
  # that sharing is the point: a denylist that is right in one workflow and
  # stale in the other is worse than none, because the stale one is still
  # trusted. See .github/scripts/pr-touches-build.sh for the list and for why
  # it is a denylist rather than an allowlist.
  #
  # Cheap and hosted. It decides; the jobs below report.
  gate:
    # `build gate`, not `gate`: install-check.yml already publishes a context
    # called `gate`, and two check runs with one name are ambiguous in the UI
    # and worse in a branch protection rule, where "require gate" would no
    # longer name one thing. Caught on this PR's own first run.
    name: build gate
    runs-on: ubuntu-26.04
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - name: Decide whether this change can affect a build
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          relevant=$(.github/scripts/pr-touches-build.sh)
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "relevant=$relevant" >> "$GITHUB_STEP_SUMMARY"
  # Builds the cargo carry on a nixpkgs bump and pushes it, so no hand push is
  # needed (#1738). `!cancelled()` plus the first step: a failed gate or carry
  # must fail the dependents, not skip them (#1134, #1144).
  carry:
    needs: gate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: The gate did not succeed, so this check cannot pass
        if: needs.gate.result != 'success'
        run: |
          echo "::error::gate concluded '${{ needs.gate.result }}'; refusing to report this required check as passed (#1134)"
          exit 1
      - uses: actions/checkout@v5
        if: needs.gate.outputs.relevant == 'true'
      - uses: ./.github/actions/setup-nix
        if: needs.gate.outputs.relevant == 'true'
      - uses: cachix/cachix-action@v17
        if: needs.gate.outputs.relevant == 'true'
        # A cache upload failing must not fail a build that succeeded (#235).
        continue-on-error: true
        with:
          skipPush: true
          # Why: .github/actions/setup-nix/action.yml -- `cachix use` would replace its substituters.
          skipAddingSubstituter: true
          name: nixarchy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Does this nixpkgs need the cargo carry?
        id: need
        if: needs.gate.outputs.relevant == 'true'
        run: |
          set -o pipefail
          status=$(nix eval --impure --json --expr "let p = (builtins.getFlake \"git+file://$PWD?shallow=1\").inputs.nixpkgs.legacyPackages.x86_64-linux; in (import $PWD/pkgs/cargo-system-libs.nix { inherit (p) lib; prev = p; }).status") || { echo "::error::could not evaluate the cargo carry"; exit 1; }
          needed=$(jq -r 'to_entries[] | select(.value=="needed") | .key' <<<"$status") || exit 1
          if [ -z "$needed" ]; then
            echo "no cargo carry is needed"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "carry needed for: $needed"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the carried packages and check they are in the system closure
        if: needs.gate.outputs.relevant == 'true' && steps.need.outputs.needed == 'true'
        run: |
          set -o pipefail
          names=$(nix eval --impure --json --expr "let p = (builtins.getFlake \"git+file://$PWD?shallow=1\").inputs.nixpkgs.legacyPackages.x86_64-linux; in builtins.attrNames (import $PWD/pkgs/cargo-system-libs.nix { inherit (p) lib; prev = p; }).packages" | jq -r '.[]') || exit 1
          top=$(nix eval --raw .#checks.x86_64-linux.vm-toplevel.drvPath) || exit 1
          nix derivation show -r "$top" | jq -r '(.derivations // .) | keys[] | sub("^/nix/store/"; "")' > drvs || exit 1
          : > "$RUNNER_TEMP/carry-outs"
          for name in $names; do
            drv=$(nix eval --impure --raw --expr "let f = builtins.getFlake \"git+file://$PWD?shallow=1\"; in (f.inputs.nixpkgs.legacyPackages.x86_64-linux.extend f.overlays.default).$name.drvPath") || exit 1
            # Only what the allowlisted system closure holds is cached; a carried
            # package outside it (omp, today) is neither built nor pushed here (#1738).
            if ! grep -qxF -- "${drv#/nix/store/}" drvs; then
              echo "::notice::$name is carried but not in vm-toplevel's closure; not caching it"
              continue
            fi
            built=$(nix build --no-link --print-out-paths "$drv^*") || exit 1
            echo "$built" >> "$RUNNER_TEMP/carry-outs"
          done
      - name: Push the carried packages to cachix
        if: needs.gate.outputs.relevant == 'true' && steps.need.outputs.needed == 'true'
        continue-on-error: true
        timeout-minutes: 10
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          mapfile -t outs < "$RUNNER_TEMP/carry-outs"
          .github/scripts/cachix-push.sh "${outs[@]}"
  # The greeter's two desktop VMs get a separate budget from the other KVM checks (#1987).
  box-vms:
    needs: [gate, carry]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    # Each suite may build its own closures on a cold hosted runner.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: greeter
            installables: .#checks.x86_64-linux.greeter-theme
          - suite: box
            installables: >-
              .#checks.x86_64-linux.wifi-hwsim .#checks.x86_64-linux.update-launch-vm .#checks.x86_64-linux.hibernate-resume .#checks.x86_64-linux.boot-hang-detect .#checks.x86_64-linux.factory-reset .#checks.x86_64-linux.remove-fingerprint-vm .#checks.x86_64-linux.sshd-login .#checks.x86_64-linux.box-boot
    steps:
      - name: The gate did not succeed, so this check cannot pass
        if: needs.gate.result != 'success'
        run: |
          echo "::error::gate concluded '${{ needs.gate.result }}'; refusing to report this required check as passed (#1134)"
          exit 1
      - name: The carry did not succeed, so this check cannot pass
        if: needs.carry.result != 'success'
        run: |
          echo "::error::carry concluded '${{ needs.carry.result }}'; refusing to report this required check as passed (#1738)"
          exit 1
      # Step-level `if:`s, so a run with nothing to do reports a real `success`.
      # `needs:` skips this job when the gate fails, and a skip passes the
      # merge gate (#1144): hence `!cancelled()` and the first step (#1134).
      - name: Nothing here can affect a build
        if: needs.gate.outputs.relevant != 'true'
        run: |
          echo "no-op: the gate found nothing this job builds" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v5
        if: needs.gate.outputs.relevant == 'true'
        with:
          fetch-depth: 0
      - name: Free disk space
        if: needs.gate.outputs.relevant == 'true'
        # Three VM checks plus the box images outgrew the runner's disk once
        # boot-hang-detect joined them (ENOSPC in box-boot, #1594).
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      - uses: ./.github/actions/setup-nix
        if: needs.gate.outputs.relevant == 'true'
      - uses: cachix/cachix-action@v17
        if: needs.gate.outputs.relevant == 'true'
        # A cache upload failing must not fail a build that succeeded (#235).
        continue-on-error: true
        with:
          # Pull only. What reaches the cache is pushed by name, from main, by
          # cachix-push.sh -- the store diff filled the free tier (#697).
          skipPush: true
          # Why: .github/actions/setup-nix/action.yml -- `cachix use` would replace its substituters.
          skipAddingSubstituter: true
          name: nixarchy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: /dev/kvm is real and writable, or fail here
        if: needs.gate.outputs.relevant == 'true'
        # ubuntu-26.04 runners have /dev/kvm, but root:kvm 0660 and the nix
        # build users are not in `kvm`; the udev rule is GitHub's own
        # documented fix. Loud rather than falling back: without a usable
        # /dev/kvm the test driver would run the node under TCG and this job
        # would quietly get slower until it started flapping against its
        # timeout -- fail on day one instead.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          grep -Eq 'vmx|svm' /proc/cpuinfo || { echo "::error::no vmx/svm in /proc/cpuinfo"; exit 1; }
          test -w /dev/kvm || { echo "::error::/dev/kvm is not writable"; exit 1; }
          ls -l /dev/kvm
      - name: Run the KVM checks for ${{ matrix.suite }}
        if: needs.gate.outputs.relevant == 'true'
        env:
          INSTALLABLES: ${{ matrix.installables }}
        run: |
          # Keep one build at a time so guests do not compete for disk and memory.
          read -r -a checks <<< "$INSTALLABLES"
          test "${#checks[@]}" -gt 0
          for check in "${checks[@]}"; do
            echo "Running fresh VM test: $check"
            VM_NAME="${check##*.}" nix build --impure --no-link -L --expr '
              let
                flake = builtins.getFlake ("git+file://" + builtins.getEnv "GITHUB_WORKSPACE");
                vm = flake.checks.x86_64-linux.${builtins.getEnv "VM_NAME"};
                fresh = old: { name = old.name + "-uncached-1987"; };
              in if vm ? overrideTestDerivation then vm.overrideTestDerivation fresh else vm.overrideAttrs fresh
            '
          done
  # Keep the required context and fail it if the VM matrix failed or skipped (#1144).
  box:
    needs: box-vms
    if: ${{ !cancelled() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Both KVM suites passed
        env:
          VM_RESULT: ${{ needs.box-vms.result }}
        run: |
          if [ "$VM_RESULT" != success ]; then
            echo "::error::box-vms concluded '$VM_RESULT'; refusing to report box as passed"
            exit 1
          fi
