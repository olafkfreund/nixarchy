name: review

# What needs updating, and what is quietly broken.
#
# Everything else here watches one thing and reports on its own run. Nothing
# watched the watchers, and it showed: on 2026-08-31 and 09-01 the Omarchy bump
# was killed by its own 20-minute timeout, which GitHub records as *cancelled*
# and `if: failure()` does not catch; on 09-02 it failed on a false positive in
# its own mapping check. Three nights, no issue, no notification, and Omarchy
# 4.0.2 -- a security release -- left unadopted the whole time.
#
# The answer is not another per-workflow reporter. It is one job that asks, out
# loud and in one place: is anything we pin behind upstream, and did the jobs
# that are supposed to tell us that actually run and pass?
#
# The logic is in pkgs/review.sh, not here, for the reason doctor.sh and
# verify.sh are scripts: `nix run .#review` gives the same answer at a prompt
# as it does at 06:00, so it can be tested by the person changing it.

on:
  schedule:
    # 06:00 UTC. After nightly's 03:00, omarchy's 04:00 and Monday's update at
    # 05:00 have finished, so it reviews the night that just happened rather
    # than the one before.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Honour this flake's own nixConfig instead of warning and
          # discarding it. Without this every `nix build` here prints
          #
          #   warning: ignoring untrusted flake configuration setting
          #   'extra-substituters'. Pass '--accept-flake-config' to trust it
          #
          # and the nixarchy and hyprland caches flake.nix declares are
          # simply not used. The hyprland one was then re-added by hand in
          # ONE job, writing /etc/nix/nix.conf because "without this the
          # runner compiles a compositor from source and times out" -- a
          # workaround for a setting the flake already carried.
          #
          # Scoped to the flake being invoked, which is this repository's
          # own. It does not extend trust to inputs.
          # accept-flake-config alone is not enough, and the reason cost a
          # day: the runner is not in the daemon's `trusted-users`, so every
          # substituter and key the flake declares is DISCARDED with
          #
          #   warning: ignoring the client-specified setting
          #   'trusted-public-keys', because it is a restricted setting and
          #   you are not a trusted user
          #
          # and the job then BUILDS what it should have downloaded. On
          # 2026-09-07 the `omarchy` and `box` jobs each compiled Hyprland to
          # 55% and hit timeout-minutes, while `system` survived only because
          # it had a hand-written `sudo tee -a /etc/nix/nix.conf` step nobody
          # had copied to the others.
          #
          # extra-conf is written into the SYSTEM nix.conf as root, so what is
          # set here is trusted and actually applies. The store path nixarchy
          # uses is byte-identical to the one hyprwm publish -- verified, not
          # assumed -- so with this the compositor is a download.
          extra-conf: |
            accept-flake-config = true
            extra-substituters = https://nixarchy.cachix.org https://hyprland.cachix.org
            extra-trusted-public-keys = nixarchy.cachix.org-1:05JOuIlsQOWY2/5DQMq7JEA1hwlhgvmMWowMfka8mMM= hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIITemDosxrE9/Kb+PfYvE=

      - name: Review, and say so
        # always(), because a review that only reports when it feels like it is
        # the thing this workflow exists to replace.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gh has no git remote to infer the repository from in a job that
          # may not have checked out -- the exact bug that broke nightly.yml's
          # reporter, fixed there in 9da7465 and set here from the start.
          GH_REPO: ${{ github.repository }}
        run: nix run .#review -- --report
