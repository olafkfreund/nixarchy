name: update

on:
  schedule:
    # Nightly, not weekly. These publish often -- hey-cli moved to 1.4.1 while
    # the 2026-09-05 nightly review watched a weekly job that would not look
    # again until Monday. A bump that waits six days for its cron is stale on
    # arrival.
    #
    # The comment that stood here said the nixpkgs-sourced apps "need nothing
    # here -- they follow whatever nixpkgs a user's own `nix flake update`
    # pulls". They follow the pin this repo commits, and nothing updated it:
    # on 2026-09-05 that pin was twelve days old, and claude-code, codex,
    # opencode, ollama and zed-editor were each several versions behind what
    # nixpkgs already had ready. flake-update.yml now moves the pin nightly;
    # this job keeps its own scope, the packages pinned here by version and
    # hash.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      arm_auto_merge:
        description: "Arm auto-merge after warm and cold hosted launch runs are reviewed"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-pinned-packages
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      pr: ${{ steps.pr.outputs.pull-request-number }}
      sha: ${{ steps.pr.outputs.pull-request-head-sha }}
      clean: ${{ steps.bump.outputs.update_failed != 'true' && steps.build.outputs.failed == '' && steps.build.outputs.changed == 'true' }}
    steps:
      - uses: actions/checkout@v5
      - name: Hold an already open pinned-package PR on its tested head
        id: hold
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr=$(gh pr list --head update/pinned-packages --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            echo "held=true" >> "$GITHUB_OUTPUT"
            echo "Holding open pinned-package PR #$pr; its tested head must not move" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: ./.github/actions/setup-nix
        if: steps.hold.outputs.held != 'true'
      - uses: cachix/cachix-action@v17
        if: steps.hold.outputs.held != 'true'
        # A cache upload failing must not fail a build that succeeded (#235).
        continue-on-error: true
        with:
          # Pull only. What reaches the cache is pushed by name, from main, by
          # cachix-push.sh -- the store diff filled the free tier (#697).
          skipPush: true
          # Why: .github/actions/setup-nix/action.yml -- `cachix use` would replace its substituters.
          skipAddingSubstituter: true
          name: nixarchy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Bump pinned packages
        id: bump
        if: steps.hold.outputs.held != 'true'
        run: |
          # The app exits 1 if any updater failed, and restores from HEAD what
          # a failed one changed, so the bumps that did land still go on (#1537).
          nix run .#update || echo "update_failed=true" >> "$GITHUB_OUTPUT"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "nothing to bump"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat
          fi

      - name: Build every bumped package
        id: build
        if: steps.hold.outputs.held != 'true' && steps.bump.outputs.changed == 'true'
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          # A stale hash left behind by a broken rewrite fails here rather than
          # in a user's rebuild. The updater refuses to bump a version without
          # its hashes, but this is the check that actually proves it.
          #
          # Derived from the same set the updater ran, not named by hand: the
          # old list here named a package this job could never change (it had
          # no updateScript) and skipped one it could (hey-cli). Building every
          # package with an updateScript rather than only what changed is
          # deliberate -- it avoids trusting a filename-to-attribute convention
          # nothing enforces.
          mapfile -t attrs < <(nix eval --json .#update.pinned | jq -r '.[] | ".#" + .')

          # mapfile returns 0 whatever the process substitution did -- a failed
          # eval, a renamed output, a jq that is not there -- and an empty
          # array would then build nothing and report every bump as built.
          #
          # The set is every package with an updateScript (ten today). The
          # floor is 1 so removing a package from the set is an ordinary edit
          # and not a CI break, while "the list came back empty" still stops
          # the job.
          if [ "${#attrs[@]}" -eq 0 ]; then
            echo "::error::.#update.pinned produced no attributes, so this step" \
                 "would pass without checking the packages the bump just" \
                 "rewrote" >&2
            exit 1
          fi

          # One build per package, so one broken upstream neither hides nor
          # cancels the others (#1537). A package that does not build has its
          # file restored from HEAD -- not the index (CLAUDE.md §5) -- and the
          # bumps that built still reach the pull request.
          failed=()
          for a in "${attrs[@]}"; do
            echo "building: $a"
            nix build --impure --print-build-logs "$a" || failed+=("${a#.#}")
          done

          for name in "${failed[@]}"; do
            pos=$(nix eval --raw ".#$name.meta.position") || {
              echo "::error::cannot find the file that defines $name" >&2
              exit 1
            }
            file=${pos#*-source/}
            file=${file%:*}
            # Refuse rather than guess: a revert outside pkgs/ is not ours to make.
            if [[ $file != pkgs/* || ! -f $file ]]; then
              echo "::error::$name is defined at '$pos', not in a pkgs/ file;" \
                   "refusing to revert it" >&2
              exit 1
            fi
            echo "reverting $name: $file did not build"
            git checkout HEAD -- "$file"
          done

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          echo "failed=${failed[*]}" >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        id: pr
        if: steps.build.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # Opened under BUMP_TOKEN so build.yml actually runs on it. With the
          # default GITHUB_TOKEN a pull request triggers no workflows at all,
          # which made the claim in the body below -- "Every package here built
          # successfully in CI" -- mean only "built in this same job".
          # Measured 2026-09-05: a PR opened with BUMP_TOKEN started six check
          # runs within fifteen seconds; the same query against a
          # GITHUB_TOKEN-opened PR returned zero. Arming remains gated below.
          token: ${{ secrets.BUMP_TOKEN || github.token }}
          branch: update/pinned-packages
          draft: true
          title: "Bump pinned packages"
          commit-message: |
            Bump pinned packages

            Generated by .github/workflows/update.yml.
          body: |
            This PR updates versions and hashes for packages pinned in nixarchy. CI runs each changed CLI's help or version command and checks that each changed desktop app opens a window and stays alive. A complete, passing version-and-hash-only bump is eligible for auto-merge once the required repository checks pass. Failed, incomplete, or manual-only probes leave this PR in draft. See the linked run for each app's result and any reverted bump.

            Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Updater failed: ${{ steps.bump.outputs.update_failed == 'true' }}
            Reverted, did not build: ${{ steps.build.outputs.failed }}
          labels: dependencies
          delete-branch: true

      # The pull request above carries what built; this keeps the run red so
      # review.yml's row still shows the night something broke (#1537).
      - name: Fail when anything did not update or build
        if: always() && (steps.bump.outputs.update_failed == 'true' || steps.build.outputs.failed != '')
        env:
          UPDATE_FAILED: ${{ steps.bump.outputs.update_failed }}
          BUILD_FAILED: ${{ steps.build.outputs.failed }}
        run: |
          [ "$UPDATE_FAILED" = true ] &&
            echo "::error::at least one updater failed; its package was not bumped (see 'Bump pinned packages')"
          [ -n "$BUILD_FAILED" ] &&
            echo "::error::reverted, did not build: $BUILD_FAILED"
          exit 1

  launch:
    needs: bump
    if: ${{ always() && needs.bump.outputs.pr != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      verdict: ${{ steps.probe.outputs.verdict }}
      base: ${{ steps.scope.outputs.base }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /
      - uses: ./.github/actions/setup-nix
      - uses: cachix/cachix-action@v17
        continue-on-error: true
        with:
          skipPush: true
          skipAddingSubstituter: true
          name: nixarchy
      - name: Check the complete PR diff on the exact head
        id: scope
        env:
          SHA: ${{ needs.bump.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SHA"
          test "$(git rev-parse "$SHA^{commit}")" = "$SHA"
          base=$(git merge-base "$SHA" origin/main)
          apps=$(python3 .github/scripts/update-launch.py scope --base "$base" --head "$SHA")
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Changed apps: $apps" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump.outputs.sha }}
          fetch-depth: 0
      - name: Resolve each app and select its probe
        id: prepare
        env:
          APPS: ${{ steps.scope.outputs.apps }}
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          set -euo pipefail
          gui='[]'
          paths=$(jq -er 'if type == "array" and length > 0 then .[] else error("empty app list") end' <<< "$APPS")
          while IFS= read -r path; do
            name=${path#pkgs/apps/}; name=${name%.nix}
            pos=$(nix eval --impure --raw ".#$name.meta.position")
            file=${pos#*-source/}; file=${file%:*}
            test "$file" = "$path" || { echo "::error::$name resolves to $pos, not $path"; exit 1; }
            kind=$(jq -r --arg n "$name" '.[$n].kind // ""' data/update-launch.json)
            test -n "$kind" || { echo "::error::$name has no probe"; exit 1; }
            if [ "$kind" = gui ]; then
              gui=$(jq -c --arg n "$name" '. + [$n]' <<< "$gui")
            fi
          done <<< "$paths"
          echo "gui=$gui" >> "$GITHUB_OUTPUT"
      - name: /dev/kvm is real and writable, or fail here
        if: steps.prepare.outputs.gui != '[]'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          grep -Eq 'vmx|svm' /proc/cpuinfo || { echo "::error::no vmx/svm in /proc/cpuinfo"; exit 1; }
          test -w /dev/kvm || { echo "::error::/dev/kvm is not writable"; exit 1; }
      - name: Run the selected launch probes
        id: probe
        env:
          APPS: ${{ steps.scope.outputs.apps }}
          GUI: ${{ steps.prepare.outputs.gui }}
          SHA: ${{ needs.bump.outputs.sha }}
          CLEAN: ${{ needs.bump.outputs.clean }}
          NIXPKGS_ALLOW_UNFREE: "1"
        run: |
          set -euo pipefail
          results='{}'
          failed=0
          paths=$(jq -er 'if type == "array" and length > 0 then .[] else error("empty app list") end' <<< "$APPS")
          while IFS= read -r path; do
            name=${path#pkgs/apps/}; name=${name%.nix}
            kind=$(jq -r --arg n "$name" '.[$n].kind' data/update-launch.json)
            if [ "$kind" = gui ]; then continue; fi
            result=PASS
            if [ "$kind" = cli ]; then
              package=$(nix build --impure --no-link --print-out-paths ".#$name") || result=FAIL
              if [ "$result" = PASS ]; then
                bin=$(nix eval --impure --raw ".#$name.meta.mainProgram") || result=FAIL
                if [ "$result" = PASS ]; then
                  test -x "$package/bin/$bin" || result=FAIL
                fi
                if [ "$result" = PASS ]; then
                  args_text=$(jq -er --arg n "$name" '.[$n].args | if type == "array" and length > 0 then .[] else error("missing CLI probe") end' data/update-launch.json) || result=FAIL
                fi
                if [ "$result" = PASS ]; then
                  mapfile -t args <<< "$args_text"
                  mkdir -p "$RUNNER_TEMP/profile-$name"
                  timeout 10 env HOME="$RUNNER_TEMP/profile-$name" XDG_CONFIG_HOME="$RUNNER_TEMP/profile-$name/config" \
                    "$package/bin/$bin" "${args[@]}" > "$RUNNER_TEMP/$name.log" 2>&1 || result=FAIL
                fi
              fi
              if [ "$result" = FAIL ]; then cat "$RUNNER_TEMP/$name.log" 2>/dev/null || true; fi
            elif [ "$kind" = manual ]; then
              result=MANUAL
              jq -r --arg n "$name" '.[$n].reason' data/update-launch.json
            fi
            results=$(jq -c --arg p "$path" --arg r "$result" '. + {($p): $r}' <<< "$results")
            echo "$name: $result" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" = FAIL ]; then failed=1; fi
          done <<< "$paths"
          if [ "$GUI" != '[]' ]; then
            if vm_out=$(NIXARCHY_LAUNCH_APPS="$GUI" nix build --impure -L --no-link --print-out-paths \
                .#checks.x86_64-linux.update-launch-vm 2> "$RUNNER_TEMP/gui.log"); then
              vm_rc=0
            else
              vm_rc=1
              failed=1
            fi
            cat "$RUNNER_TEMP/gui.log"
            gui_names=$(jq -r '.[]' <<< "$GUI")
            while IFS= read -r name; do
              path="pkgs/apps/$name.nix"
              gui_result=MISSING
              if [ "$vm_rc" -eq 0 ]; then
                gui_result=$(jq -er --arg n "$name" '.[$n] // "MISSING"' "$vm_out/verdicts.json") || gui_result=MISSING
              fi
              if [ "$gui_result" != PASS ]; then failed=1; fi
              results=$(jq -c --arg p "$path" --arg r "$gui_result" '. + {($p): $r}' <<< "$results")
              echo "$name: $gui_result" >> "$GITHUB_STEP_SUMMARY"
            done <<< "$gui_names"
          fi
          updater=partial
          build=partial
          if [ "$CLEAN" = true ]; then updater=clean; build=clean; fi
          verdict=$(jq -cn --arg sha "$SHA" --arg updater "$updater" --arg build "$build" \
            --argjson results "$results" '{sha:$sha,updater:$updater,build:$build,results:$results}')
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          [ "$failed" -eq 0 ]

  arm:
    needs: [bump, launch]
    if: ${{ always() && needs.bump.outputs.pr != '' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Report the tested head and arm only complete evidence
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.bump.outputs.pr }}
          SHA: ${{ needs.bump.outputs.sha }}
          BASE: ${{ needs.launch.outputs.base }}
          VERDICT: ${{ needs.launch.outputs.verdict }}
          BUMP_RESULT: ${{ needs.bump.result }}
          LAUNCH_RESULT: ${{ needs.launch.result }}
          ARM_AUTO_MERGE: ${{ inputs.arm_auto_merge || false }}
        run: |
          set -euo pipefail
          pr_json=$(gh api "repos/$GH_REPO/pulls/$PR")
          login=$(gh api user --jq .login)
          jq -e --arg repo "$GH_REPO" --arg sha "$SHA" --arg login "$login" \
            '.state == "open" and .draft == true and .base.ref == "main" and
             .head.ref == "update/pinned-packages" and .head.repo.full_name == $repo and
             .head.sha == $sha and .user.login == $login and .commits == 1' \
            <<< "$pr_json" >/dev/null || { echo "::error::PR identity or head changed"; exit 1; }
          gh api "repos/$GH_REPO/pulls/$PR/commits" --jq '.[0].commit.message' \
            | grep -Fx 'Generated by .github/workflows/update.yml.' >/dev/null \
            || { echo "::error::PR commit is not owned by this updater"; exit 1; }
          if [ -n "$VERDICT" ]; then
            body=$(gh pr view "$PR" --json body --jq .body)
            {
              printf '%s\n\n' "$body"
              printf 'Tested head: `%s`  \nRun: https://github.com/%s/actions/runs/%s\n\n' "$SHA" "$GH_REPO" '${{ github.run_id }}'
              printf '%s\n' "$VERDICT" | jq -r '.results | to_entries[] | "- `\(.key)`: \(.value)"'
            } > "$RUNNER_TEMP/body.md"
            gh pr edit "$PR" --body-file "$RUNNER_TEMP/body.md"
          fi
          if [ "$BUMP_RESULT" != success ] || [ "$LAUNCH_RESULT" != success ]; then
            echo "::error::updater/build or launch result is incomplete; PR stays draft"
            exit 1
          fi
          git fetch --no-tags origin "$SHA"
          rc=0
          python3 .github/scripts/update-launch.py eligible --base "$BASE" --head "$SHA" \
            --verdict <(printf '%s' "$VERDICT") || rc=$?
          # 3: not every changed app has a passing launch (a manual-only app, a
          # failed probe): the PR stays a draft for a person, and that is no failure.
          if [ "$rc" = 3 ]; then
            echo "PR stays draft: not every changed app has a passing launch result; see the launch job" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ "$rc" = 0 ] || exit "$rc"
          if [ "$ARM_AUTO_MERGE" != true ]; then
            echo "Launch passed; auto-merge arming flag is OFF pending warm and cold hosted runs" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          checks='[]'
          for _ in 1 2 3 4 5 6; do
            checks=$(gh api "repos/$GH_REPO/commits/$SHA/check-runs" --jq '[.check_runs[].name]')
            if jq -e '(["lint", "system", "devenv-presets", "install"] - . | length) == 0' \
                <<< "$checks" >/dev/null; then break; fi
            sleep 20
          done
          jq -e '(["lint", "system", "devenv-presets", "install"] - . | length) == 0' \
            <<< "$checks" >/dev/null || { echo "::error::required PR checks did not start; PR stays draft"; exit 1; }
          gh pr ready "$PR"
          gh pr merge "$PR" --auto --squash --match-head-commit "$SHA"
          state=$(gh pr view "$PR" --json mergeStateStatus --jq .mergeStateStatus)
          echo "Auto-merge armed for $SHA; required checks started; mergeability: $state" >> "$GITHUB_STEP_SUMMARY"
