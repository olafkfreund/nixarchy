name: nightly

# The checks that cannot run on a hosted runner.
#
# `build.yml` covers everything that fits in fourteen gigabytes and ten
# minutes. These two do not, and the numbers are the reason rather than a
# preference: checks.install boots a VM and installs a desktop into it, and
# checks.install-iso builds a 5.6 GB image, boots it with no network device at
# all, and installs a 15.3 GB closure into a qcow2. That is about an hour and
# roughly 16 GB of build directory, on a machine with /dev/kvm.
#
# So they run here, nightly, on the self-hosted runners -- p510 (40 cores,
# 94 GB, KVM) and p620 -- where builds land on each host's own build-dir
# (`/home/nix-build` on p510, `/mnt/games/nix-build` on p620) with hundreds of
# gigabytes free. See hosts/*/nixos/github-runner.nix in the NixOS config repo
# for the runners themselves.
#
# Nothing here writes outside the Nix store. An earlier version archived each
# night's ISO to /mnt/img_pool on p510; that never once succeeded (the runner
# units are ProtectSystem=strict with an empty ReadWritePaths) and it was aimed
# at the wrong disk anyway -- /mnt/img_pool is p510's SMR drive, which the host
# deliberately avoids writing to, and it does not exist as a filesystem on p620
# at all. The ISO's store path is printed in the job summary instead; anyone who
# wants a copy of a particular night's image can pin it by hand from there.
#
# Nightly rather than per-push on purpose. An hour of wall clock per push would
# make the queue the bottleneck, and what these protect against -- a package
# falling out of the baked closure, an installer that stops booting -- does not
# arrive between one push and the next. It arrives when an input moves.

on:
  schedule:
    # 03:00 UTC. Late enough that a `nix flake update` merged during the day is
    # covered, early enough that a failure is waiting in the morning.
    - cron: "0 3 * * *"
  workflow_dispatch:

# One at a time. These are long, they want the whole machine, and two installs
# competing for the same pool is how a disk fills.
concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  install:
    name: install onto a blank disk
    runs-on: [self-hosted, nixos, kvm, big]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # No installer action and no cachix: this runner is a NixOS machine with
      # nix already on it and the store already warm, which is most of why it
      # is fast enough to do this nightly.
      - name: Install onto a blank disk and boot the result
        run: nix build .#checks.x86_64-linux.install --print-build-logs

      # installer-vm is a runnable script, not a check, so nothing has ever
      # built it -- and it sat broken for weeks because of that: its writable
      # store was a RAM-backed tmpfs and the closure outgrew it, which surfaced
      # as ENOSPC three levels under a "1 dependency failed" (#134).
      #
      # Building it does not run an install, so it will not catch that class
      # again on its own. What it does catch is the cheap half -- an evaluation
      # or packaging error in a harness nobody exercises until the day they
      # need it, which is the worst day to discover it is broken.
      - name: The install VM harness still builds
        run: nix build .#installer-vm --no-link --print-build-logs

      - name: Report the install duration
        if: always()
        run: |
          # checks.install prints the installer's own figure and fails above a
          # budget; this surfaces it in the job summary so a slow trend is
          # visible before it crosses the line.
          nix log .#checks.x86_64-linux.install 2>/dev/null \
            | grep -E '^(driver|install)_seconds=' \
            | tee -a "$GITHUB_STEP_SUMMARY" || echo "no timing recorded"

  install-iso:
    name: install from the ISO, with no network
    runs-on: [self-hosted, nixos, kvm, big]
    # The ISO build dominates: the squashfs alone is most of it.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Build the ISO
        run: nix build .#iso --no-link --print-build-logs

      - name: Report the ISO size
        run: |
          iso=$(nix build .#iso --no-link --print-out-paths)/iso
          size=$(du -h "$iso"/*.iso | cut -f1)
          # `read`, not awk. The runner's step shell is a Nix bash whose PATH
          # carries coreutils but not gawk, so the first real nightly died
          # here with `awk: command not found` and exit 127 -- after the ISO
          # had built perfectly well. Bash can split two fields by itself.
          read -r _ closure < <(nix path-info -Sh \
            .#nixosConfigurations.reference.config.system.build.toplevel)
          printf '| | |\n|---|---|\n| ISO | %s |\n| closure | %s |\n| store path | %s |\n' \
            "$size" "$closure" "$iso" | tee -a "$GITHUB_STEP_SUMMARY"

      # The number the size report prints is only useful if something acts on
      # it. This is that. It builds the network image too, which is the one
      # with a hard ceiling: over 2 GiB it stops fitting in a release as a
      # single asset.
      - name: Both images are inside their budgets
        run: |
          set -o pipefail
          nix build .#checks.x86_64-linux.iso-budget --no-link --print-build-logs 2>&1 \
            | tail -5 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install from it with no network device present
        run: nix build .#checks.x86_64-linux.install-iso --print-build-logs

  # A failure at 03:00 that nobody sees until someone opens the Actions tab is
  # a failure that costs a day. This turns one into an issue.
  # Is the binary cache actually being filled?
  #
  # Nothing else asks. cachix-action's push is a POST step, and its failures do
  # not reach the job's result the way an ordinary step's do:
  #
  #   - a REJECTED TOKEN is silent. cachix logs the 403, prints "Failed to
  #     push", and exits 0. The job is green and nothing was cached. Measured,
  #     not assumed: run 33883428617 pushed with a deliberately bad token and
  #     passed.
  #   - a BUSY DAEMON exited 3 and reddened three of four concurrent pull
  #     requests (#235), which is why #264 made every cachix step
  #     continue-on-error. That was right -- a red check meaning "the cache was
  #     busy" trains people to re-run without reading -- but it also means the
  #     one loud failure mode is now quiet too.
  #
  # So both directions are silent, and the only honest question left is not
  # "did the command succeed" but "is the artefact there". That is answerable
  # without credentials: cachix serves .narinfo over plain HTTP, 200 when the
  # path is in the cache and 404 when it is not.
  #
  # Nightly rather than per-PR, deliberately. An expired token is a slow
  # failure -- it will still be expired tomorrow -- while a busy cache is a
  # fast one, and asserting this on every pull request would re-create exactly
  # the flapping red check #264 removed.
  #
  # Evaluated, never built. `nix eval .#omarchy.outPath` gives the path CI
  # pushed without producing it, which matters: since #212 the omarchy
  # derivation depends on the flake's own rev and lastModified, so a path built
  # from any other tree -- a branch, a dirty checkout -- is a DIFFERENT path
  # that would 404 for reasons having nothing to do with the cache.
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@main

      - name: The cache holds what main last built
        run: |
          path=$(nix eval --raw ".#omarchy.outPath")
          hash=$(basename "$path" | cut -d- -f1)
          echo "main's omarchy: $path"

          # Three tries. A push that landed seconds ago may not be served yet,
          # and one 404 is not evidence of a broken token.
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://nixarchy.cachix.org/$hash.narinfo")
            echo "attempt $attempt: HTTP $code"
            [ "$code" = 200 ] && exit 0
            sleep 20
          done

          echo "::error::nixarchy.cachix.org does not have main's omarchy ($hash)."
          echo "Every build is green and nothing is being cached. The most"
          echo "likely cause is CACHIX_AUTH_TOKEN: cachix exits 0 when a token"
          echo "is rejected, so no job has failed and none will. Check the"
          echo "token before looking anywhere else."
          exit 1

      - name: The cache holds the MicroVM template runners
        # The "first launch is a download, not a build" half of #221's cache
        # promise, which no PR check can gate: cachix-action pushes in a
        # post-job step, AFTER build.yml's system job has already reported --
        # so a probe on a pull request would race the very push it is
        # checking. Nightly, like the omarchy probe above, and for the same
        # token-expiry reason.
        #
        # Both variants per template: users download the KVM runner,
        # checks.microvm-boot downloads -tcg.
        run: |
          fail=0
          for name in $(nix eval --impure --raw --expr \
              'toString (builtins.attrNames (import ./data/microvm-templates.nix))'); do
            for variant in "" "-tcg"; do
              attr="microvm-$name$variant"
              path=$(nix eval --raw ".#$attr.outPath")
              hash=$(basename "$path" | cut -d- -f1)
              code=$(curl -s -o /dev/null -w '%{http_code}' \
                "https://nixarchy.cachix.org/$hash.narinfo")
              echo "$attr: $path -> HTTP $code"
              [ "$code" = 200 ] || fail=1
            done
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::a template runner is missing from nixarchy.cachix.org."
            echo "A user's first 'nixarchy vm run' of that template is a build,"
            echo "not a download. build.yml's system job (checks.microvm-template)"
            echo "is what builds and pushes these -- check its last run on main,"
            echo "then the CACHIX_AUTH_TOKEN, in that order."
            exit 1
          fi

  report:
    name: report a failure
    runs-on: ubuntu-latest
    needs: [install, install-iso, cache]
    # cancelled() too. On 2026-09-02 install-iso hit its 180-minute timeout,
    # which GitHub records as cancelled rather than failed, and this job --
    # the one whose whole purpose is that a 03:00 failure does not cost a day
    # -- did not run. A watchdog that only barks at one of the two ways its
    # subject can die is not a watchdog.
    if: failure() || cancelled()
    permissions:
      issues: write
    steps:
      - name: Open or update an issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job has no checkout, so `gh` has no git remote to infer the
          # repository from and every call failed with "not a git repository".
          # The safety net that tells you a nightly broke was itself broken,
          # which is the worst place for this bug to have been.
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # WHICH nightly broke. The title is the issue's identity -- it is what
          # the dedupe below searches on -- so a cache failure filed under "the
          # install checks are failing" would both hide itself and reopen the
          # install issue. #236 was exactly that shape: a watchdog issue whose
          # title sent the reader at the wrong thing, and the duplicate hunt cost
          # more than the bug did.
          if [ "${{ needs.cache.result }}" = "failure" ]; then
            title="nightly: nothing is reaching the binary cache"
          else
            title="nightly: the install checks are failing"
          fi
          # Which of the two it was. A timeout and a failed assertion want
          # different first moves, and the issue is the only place anyone
          # sees either.
          what="failed"
          [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ] &&
            what="timed out or was cancelled"
          # One issue, reopened and commented, rather than a new one each
          # night: a check broken for a week should read as one problem, not
          # seven.
          body="The nightly $what: $RUN"
          body="$body

          Both jobs run on a self-hosted runner (p510 or p620). If the
          failure is 'no space left', check that host's nix build-dir and its
          store -- /home/nix-build and / on p510, /mnt/games/nix-build and /
          on p620. A VM test that runs out of room does not fail cleanly, it
          wedges."
          existing=$(gh issue list --state open --search "$title in:title" \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing ($what): $RUN"
          else
            gh issue create --title "$title" --label installer --body "$body"
          fi
