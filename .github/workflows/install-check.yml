name: install check

# Its own workflow, and that is the entire point of the file.
#
# This lived in build.yml, where a workflow-level `concurrency` with
# `cancel-in-progress: true` gives PR pushes the fast feedback they should
# have. That setting cancels the whole RUN, and a job-level
# `cancel-in-progress: false` cannot opt out of it -- job-level concurrency
# governs queuing between runs, not whether the workflow-level rule reaps this
# one. So the hour-long install job was cancelled by whatever landed on main
# next, every time. It had never once finished in CI, and the job-level block
# below is why I believed it had been protected.
#
# Splitting the file is the fix: this workflow has its own concurrency group,
# nothing on main cancels it, and build.yml keeps its snappy PR behaviour.
# (Pull requests are the one place where cancelling is right; see the
# concurrency block below.)

# It also runs on pull requests, and the filter is a denylist on purpose.
#
# For most of this repo's life it did not. It ran on main and nightly, so the
# first real gate on "does an install still work" was main itself, and every PR
# touching the installer merged on faith. #123 is what that costs: the
# hosts/<name>/ layout changed the module order, system-path hashed the new
# order into a different derivation, and the installer node then tried to build
# 517 derivations from hex0-seed in a sandbox with no network. PR CI was green
# the whole way. It was caught by someone running it by hand, which is not a
# process.
#
# The obvious fix is a `paths:` allowlist naming the installer -- and it is the
# wrong shape. Work out what it would have to name and the answer is
# everything: installer/ and tests/install.nix write and drive the install,
# modules/ and pkgs/ and data/ and vm/ and flake.nix and flake.lock are the
# closure it installs. #141, the PR that implemented #123, touched flake.nix,
# installer/, modules/apps.nix and tests/install.nix -- four of those at once.
# What is left over is documentation. An allowlist of everything-but-docs,
# written as an allowlist, is a list that silently stops covering the next
# directory somebody adds, and a filter that misses a path is worse than no
# filter because it still reads like coverage. That is the same failure this
# whole file is about, one level down.
#
# So: everything is relevant, and then the handful of paths that provably
# cannot change what an install produces are subtracted. A new top-level
# directory is covered on the day it appears, and dropping something out of
# coverage takes a deliberate line in the `gate` job below. .github/** is
# excluded because no workflow file can break an install -- with this one
# re-included, since a change to how the gate runs should be tested by the gate
# running.
#
# That list used to live in `on: pull_request: paths:`, and #183 is why it does
# not any more. A workflow filtered out at the `on:` level does not report a
# skipped check; it reports NOTHING AT ALL. Measured, on #167 (docs-only): its
# check-runs are `devenv-presets, lint, omarchy, system` and there is no
# `install` entry of any kind. GitHub cannot express "required if it ran", so
# requiring an absent context waits for a report that will never arrive, and a
# docs-only PR is unmergeable forever.
#
# The denylist is therefore read one level in, by the `gate` job, and `install`
# runs on every pull request and exits 0 when there is nothing to do. Then the
# context always exists and can safely be a required check.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: install-check-${{ github.ref }}
  # Not a constant, and #144 assumed it was one: it read this file as already
  # having `cancel-in-progress`, and it has it set to false. On main that is
  # right and deliberate -- the whole reason this file was split out of
  # build.yml was that build.yml's workflow-level cancel-in-progress reaped the
  # hour-long install every time something else landed, so it had never once
  # finished in CI.
  #
  # On a pull request the same setting is wrong in the other direction. This
  # runs on one self-hosted machine for ~15 minutes; with cancelling off, three
  # pushes to a branch queue three installs of a tree nobody is going to merge,
  # and the run that matters waits behind two that are already superseded. A PR
  # only ever needs an answer about its current head.
  #
  # github.ref is refs/pull/<n>/merge on a PR, so each branch still has its own
  # group and cancelling one never touches another, or main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The denylist, moved inside the workflow. Cheap, hosted, and deliberately
  # not the required context: it decides, `install` reports.
  gate:
    name: gate
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      runner: ${{ steps.filter.outputs.runner }}
    steps:
      # This job used to need no checkout at all -- it asked the API for the
      # file list and decided from that. It needs one now only because the
      # denylist is a script in the repo rather than inline YAML. Sparse and
      # depth 1: the one file, not the history.
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Decide whether this change can affect an install
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # The denylist moved to .github/scripts/pr-touches-build.sh, because
          # build.yml now asks the same question and two copies of a filter is
          # how one of them goes stale while both are still trusted. The
          # reasoning that was here is there, next to the list.
          relevant=$(.github/scripts/pr-touches-build.sh)

          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

          # And which machine `install` should ask for. A run with nothing to
          # do must not take a slot in the self-hosted pool -- four runners
          # now (p510-nixarchy, p510-nixarchy-2, p620-nixarchy,
          # p620-nixarchy-2), all carrying the same labels, so a job lands on
          # whichever is free. This comment said "the one self-hosted box" and
          # sized the queue for one; the fleet has since quadrupled and the
          # number was left behind. The argument survives the correction, it
          # is just four times less dire: a docs PR occupying a KVM runner for
          # a check it is not going to run still delays every PR that needs
          # one.
          if [ "$relevant" = true ]; then
            echo 'runner=["self-hosted","nixos","kvm","big"]' >> "$GITHUB_OUTPUT"
          else
            echo 'runner=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

          echo "relevant=$relevant" >> "$GITHUB_STEP_SUMMARY"

  install:
    name: install
    needs: gate

    # One install VM at a time, machine-wide.
    #
    # This job boots a nested QEMU VM and runs an installer inside it against a
    # THIRTY MINUTE budget -- tests/install.nix:495, `timeout=1800`. That budget
    # is wall-clock INSIDE THE GUEST, and a guest gets slower when the host is
    # contended. So concurrency here does not merely slow installs down, it
    # converts them into failures, and the failure names the installer rather
    # than the contention:
    #
    #   AssertionError: nixarchy-install exited 124
    #
    # Measured on 2026-09-09, when the runner pool went from two to four on one
    # machine:
    #
    #   2 concurrent install jobs   both SUCCEEDED, ~36 min wall
    #   3-4 concurrent              every one FAILED at the in-VM timeout
    #
    # One of those failures was on `main` rather than a pull request, so no
    # change under test could explain it, and one was on an established runner
    # rather than a new one, so it was not a cold store either.
    #
    # cancel-in-progress is FALSE here on purpose, unlike the workflow-level
    # group above. That one cancels superseded runs of the SAME branch, which
    # is right. This one queues DIFFERENT branches behind each other, and
    # cancelling would throw away a run that was going to pass.
    #
    # The other three runners keep working: this caps the one job that boots a
    # VM, not the build, system, box or omarchy jobs that run beside it. Adding
    # runners still helps everything except this.
    #
    # Raising the in-VM timeout was the obvious alternative and is worse: it
    # would hide a real slowdown, and the number it hid would be the one that
    # tells you the host is oversubscribed.
    concurrency:
      group: nixarchy-install-vm
      cancel-in-progress: false

    # No `if:` on this job, and that is the whole fix -- measured, not assumed.
    # A probe run with three jobs reported: a job skipped by a job-level `if:`
    # appears as a check-run with conclusion `skipped`, and `skipped` is not
    # `success`, so requiring it blocks the merge just as an absent context
    # does. The same job with the `if:` moved onto its steps reported
    # `success`. So the steps below carry the condition and the job always
    # completes green.
    #
    # p510: 40 cores, 94 GB, /dev/kvm, and a pool with room for the images.
    # This job boots a VM, installs a desktop onto a blank disk, boots the
    # result on its own bootloader and asserts a rebuild builds nothing. None
    # of that fits on a hosted runner -- fourteen gigabytes of disk and no KVM
    # worth the name -- and it is the only check that exercises the artefact a
    # person actually receives. When there is nothing to do it asks for a
    # hosted runner instead, which is what the fromJSON is for: `runs-on`
    # takes an expression, but a label LIST has to arrive as JSON.
    runs-on: ${{ fromJSON(needs.gate.outputs.runner) }}

    # No job-level concurrency: the `concurrency:` at the top of this file
    # already says it, and saying it twice is how the first version came to
    # look protected while being cancelled every time.
    #
    # 90, not 45: this job does two full installs now. The old number was sized
    # for one, and a timeout is recorded as `cancelled` -- which reads like
    # somebody pressed a button rather than like the job running out of road,
    # the exact confusion the top of this file is about.
    timeout-minutes: 90

    steps:
      - name: Nothing here can affect an install
        if: needs.gate.outputs.relevant != 'true'
        run: |
          echo "Only paths the gate excludes changed; not building." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5
        if: needs.gate.outputs.relevant == 'true'

      # No installer action, and cachix to PULL from only. The runner is a
      # NixOS machine with a warm store, which is most of why this is ten
      # minutes rather than an hour -- when the work happens to land on the
      # machine that did it last time.
      #
      # It often does not. There are FOUR self-hosted runners (p510-nixarchy,
      # p510-nixarchy-2, p620-nixarchy, p620-nixarchy-2), they carry identical
      # labels so a job takes whichever is free, and they do not share a
      # store. "Warm store" is therefore a one-in-four proposition, and this
      # comment used to say "the one self-hosted box" from when it was true.
      #
      # What that cost, measured: #434 changes networking.hostName, which
      # gives every system closure a new path. Its hosted `system` job had
      # already built and PUSHED those closures to cachix -- and this job
      # could not pull them, so it rebuilt three reference systems and two
      # full installs from scratch, three times, timing out at the 90-minute
      # cap on three different machines.
      #
      # Pull only, deliberately. This job pushes its three proofs by hand
      # below; it has no business uploading the rest, and a push here would
      # race the hosted jobs that own those paths.
      #
      # Both installs in ONE nix invocation, so nix runs them at the same time
      # rather than one after the other. Measured on run 33798891329, which is
      # what #231 is about: install took 1722s, free-space 1594s, and every
      # other step in the job totalled four. Two independent derivations, run
      # serially, on a machine with forty cores.
      #
      # THREE now, and --max-jobs matches. installer-refusal was added as a
      # third derivation and the cap stayed at 2, so it queued behind one of
      # the installs and its wall clock ADDED to theirs instead of overlapping
      # -- in a 90-minute job that the pair alone already grazed under load on
      # 2026-09-03. It is a VM too (memorySize 2048, cores 2), not a
      # runCommand, so the wait is minutes rather than seconds.
      #
      # The envelope still fits with room: 6144 + 6144 + 2048 is 14.3 GB and
      # ten cores of a 40-core, 94 GB box. Each install also carries its own
      # globalTimeout of 85 minutes, so the driver still loses the race against
      # this job's 90 and fails with a log instead of being recorded as
      # cancelled.
      #
      # What this gives up, stated because it was deliberate: free-space used
      # to run second, so that an installer broken in a way that has nothing to
      # do with partitioning was reported by checks.install "in a tenth of the
      # log". Now both fail together and the reader filters. That is affordable
      # because nix prefixes every line with the derivation it came from --
      # `vm-test-run-nixarchy-install>` and `vm-test-run-nixarchy-free-space>`
      # -- so the two logs interleave without becoming one.
      #
      # free-space is the one check in the repo whose failure means somebody's
      # other operating system did not survive. It is here rather than in
      # build.yml for the reason at the top of this file: it boots a VM,
      # installs, and boots the result, and a push to main would cancel it
      # there.
      - name: Install onto a blank disk, and into free space beside a neighbour
        if: needs.gate.outputs.relevant == 'true'
        run: |
          # --extra-substituters rather than the cachix action: the action
          # installs a post-job push step, and this job must not push what it
          # did not build. The key is public; pulling needs no token, which is
          # also why this works on a runner whose secrets we would rather not
          # widen.
          nix build --print-build-logs --max-jobs 3 \
            --extra-substituters https://nixarchy.cachix.org \
            --extra-trusted-public-keys nixarchy.cachix.org-1:05JOuIlsQOWY2/5DQMq7JEA1hwlhgvmMWowMfka8mMM= \
            .#checks.x86_64-linux.install \
            .#checks.x86_64-linux.free-space \
            .#checks.x86_64-linux.installer-refusal

      # The proof that this passed, made durable and queryable.
      #
      # These outputs are `vm-test-run-*` store paths: 4 KB of logs each, not
      # images. Until now they existed only in this runner's local store,
      # which means (a) a garbage collection erases the evidence that a given
      # derivation ever passed, and (b) nothing anywhere else can ask. A
      # hosted job cannot cheaply find out whether this exact check has
      # already been proven, so it cannot decide to skip it.
      #
      # With them in the cache, `nix path-info --store https://nixarchy...`
      # answers that in one HTTP metadata round-trip, no download. That is a
      # stronger signal than comparing derivation hashes between two commits:
      # an unchanged hash only says "the inputs are identical", which on a red
      # main would skip a still-failing check forever. A cached OUTPUT says
      # the thing actually built and passed.
      #
      # cachix push rather than the action, because the action wraps the whole
      # job in a post-step and this job's other work must not be tied to it.
      # continue-on-error for #235's reason: a cache upload failing must not
      # fail a build that succeeded.
      - name: Push the proof, so nobody has to prove it twice
        if: needs.gate.outputs.relevant == 'true'
        continue-on-error: true
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          [ -n "$CACHIX_AUTH_TOKEN" ] || { echo "no cachix token; skipping"; exit 0; }
          for c in install free-space installer-refusal; do
            out=$(nix eval --raw ".#checks.x86_64-linux.$c" 2>/dev/null) || continue
            [ -e "$out" ] || continue
            echo "pushing $c ($(du -sh "$out" | cut -f1))"
            nix run --inputs-from . nixpkgs#cachix -- \
              push nixarchy "$out" || echo "push of $c failed; not fatal"

            # And ask the cache whether it took it -- here, on this commit,
            # seconds later.
            #
            # The first version of this verification lived in the nightly, as
            # a probe that evaluated main and checked those paths were
            # present. It could not work: these checks embed the flake source,
            # so ANY commit gives them new store paths, and the probe was
            # comparing what main evaluates now against what was pushed a
            # commit ago. It reported the cache broken on the first nightly
            # after a merge, and the cache was fine.
            #
            # Here there is no cross-commit problem to get wrong. The path was
            # just built and just pushed; if the cache does not have it a
            # moment later, the push genuinely did not work -- which is the
            # only thing worth knowing, and the thing cachix will not tell us
            # because it exits 0 on a rejected token.
            #
            # Not fatal, for the same reason the push is not: a cache upload
            # must not fail a build that succeeded (#235). It is loud instead,
            # and the summary carries it.
            hash=$(basename "$out" | cut -d- -f1)
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "https://nixarchy.cachix.org/$hash.narinfo")
            if [ "$code" = 200 ]; then
              echo "  $c: in the cache"
            else
              echo "::warning::$c was pushed but the cache does not have it (HTTP $code)"
              echo "cachix exits 0 on a rejected token, so this is the only" >&2
              echo "signal that the push did not work. Check CACHIX_AUTH_TOKEN." >&2
              {
                echo "- \`$c\` pushed but not in the cache (HTTP $code)"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Report what it cost
        if: always() && needs.gate.outputs.relevant == 'true'
        run: |
          # The installer's own figure, not the driver's, and the same one the
          # finish screen shows. checks.install already fails above a budget;
          # this puts the number in the summary so a slow trend is visible
          # before it crosses the line.
          nix log .#checks.x86_64-linux.install 2>/dev/null \
            | grep -E '^(driver|install)_seconds=' \
            | tee -a "$GITHUB_STEP_SUMMARY" || echo "no timing recorded"
