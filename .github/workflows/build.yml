name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # A weekly re-run against the COMMITTED lock. This used to claim it
    # caught a break "before someone else's `nix flake update` does", and it
    # cannot: the lock pins every flake input, so on those it proves nothing
    # the last merged PR did not already prove. #320 is the measurement --
    # nixpkgs renamed ffmpeg_7 away, every downstream consumer broke, and
    # this run stayed green because its lock still held the old nixpkgs.
    # nightly.yml's canary job is the one that resolves the inputs the way a
    # user's update would.
    #
    # What this run DOES watch is everything the checks reach past the lock
    # for: the live issue list the roadmap check reads, and the fetched
    # upstream artefacts. Those move on their own schedule, so a scheduled run
    # is what notices -- and the roadmap check now runs ONLY here and on
    # pushes to main, because a pull request cannot be responsible for an issue
    # somebody closed while it was open.
    #
    # "the registry nixpkgs that every mapped app still evaluates asks" used to
    # be on this list and is not any more: that check resolves `nixpkgs#`
    # through --inputs-from . now, so it reads this repository's pin and moves
    # only when the lock does.
    - cron: "0 6 * * 1"

concurrency:
  # Per COMMIT on main, per branch everywhere else.
  #
  # `cancel-in-progress: false` was not enough, and the reason is a separate
  # GitHub rule the flag does not touch: only one run per group may be
  # PENDING, and "any previously pending job or workflow in the concurrency
  # group will be canceled" when a newer one queues. So with one run building
  # and merges arriving behind it, run 2 is cancelled by run 3, run 3 by run
  # 4, and only the first and last of a burst ever report.
  #
  # That is the data loss the note below describes, still happening after the
  # fix written for it: five consecutive merges left main with no `box` result
  # at all. A shared group cannot express "keep every one of these" -- so on
  # main the SHA joins the group and each merged commit gets a group of its
  # own, which nothing can supersede.
  #
  # On a PR branch the old behaviour is right and is kept: a newer push really
  # does supersede the older one, and cancelling saves a runner.
  #
  # The cost, stated: a burst of merges to main now runs concurrently rather
  # than serially, so the self-hosted queue can grow. That is the trade being
  # made deliberately -- a verdict nobody gets is worth less than a runner
  # minute, and every push to main is a different merged commit that nothing
  # will ever re-test.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
      github.ref == 'refs/heads/main' && github.sha || 'shared' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Can this change affect anything Nix builds?
  #
  # Same question install-check.yml has asked since #183, same script, and
  # that sharing is the point: a denylist that is right in one workflow and
  # stale in the other is worse than none, because the stale one is still
  # trusted. See .github/scripts/pr-touches-build.sh for the list and for why
  # it is a denylist rather than an allowlist.
  #
  # Cheap and hosted. It decides; the jobs below report.
  gate:
    # `build gate`, not `gate`: install-check.yml already publishes a context
    # called `gate`, and two check runs with one name are ambiguous in the UI
    # and worse in a branch protection rule, where "require gate" would no
    # longer name one thing. Caught on this PR's own first run.
    name: build gate
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - name: Decide whether this change can affect a build
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          relevant=$(.github/scripts/pr-touches-build.sh)
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "relevant=$relevant" >> "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
      - uses: cachix/cachix-action@v17
        # A failed cache upload must not fail a build that succeeded. #235: three
        # of four concurrent pull requests went red in `Post Run
        # cachix/cachix-action@v17` -- every build step had passed, the daemon
        # was walking the store skipping paths already in the cache, then it
        # aborted with exit code 3. The fourth, running in the same
        # five-minute window, pushed fine. That reads as a ceiling on cachix's
        # side rather than anything in the change, and a red check that means
        # "the cache was busy" teaches everyone to re-run without reading --
        # the habit AGENTS.md 10 exists to prevent.
        #
        # `continue-on-error` on the step, not `skipPush`, because pushing
        # from pull requests is what fills the cache before main needs it. A
        # post step's continue-on-error is read off the SAME step definition
        # as the main one -- ActionRunner.ContinueOnError => Action
        # .ContinueOnError, and the post runner is created with
        # `actionRunner.Action = Action` -- so this covers the post-job push,
        # which is where #235 fails.
        #
        # What it also covers, stated because it was not free: a failure in
        # the main step -- installing cachix, adding the substituter -- stops
        # failing the job too. That one only costs cache misses; the build
        # steps below still decide the result.
        continue-on-error: true
        with:
          name: nixarchy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check formatting
        run: nix fmt -- --ci

      - name: statix
        run: nix run --inputs-from . nixpkgs#statix -- check .

      - name: deadnix
        run: nix run --inputs-from . nixpkgs#deadnix -- --fail .












      # The workflow files themselves, against GitHub's own schema.
      #
      # Added because build.yml shipped BROKEN and nothing caught it: a bad
      # conflict resolution left `box:` with no body, GitHub rejected the
      # whole workflow at startup, and every run produced ZERO JOBS. No job
      # meant no check, so the four required contexts never reported and
      # branch protection blocked every merge -- a dead CI gate that looked
      # from the outside like "checks pending", for hours.
      #
      # `yq` parses that file happily, which is why local validation passed.
      # actionlint uses GitHub's schema and says exactly what is wrong:
      #
      #   "runs-on" section is missing in job "box"
      #   "steps" section is missing in job "box"
      #   "box" job should not be empty
      #
      # -ignore drops shellcheck's info level only, matching the -S warning
      # this repo already uses for its own scripts. Errors and warnings still
      # fail. Without it the four pre-existing info notes (SC2012/2013/2016)
      # would fail a workflow file that is fine.
      - name: The workflow files are valid GitHub Actions
        run: |
          nix shell --inputs-from . nixpkgs#actionlint -c \
            actionlint -ignore 'SC[0-9]+:(info|style):'

  # Every preset in data/devenv-presets.nix, scaffolded with the real
  # `nixarchy dev init` and handed to a real devenv to evaluate.
  #
  # A job rather than a flake check, which is not where #150 expected it to
  # land. Evaluating a devenv project fetches the inputs devenv.yaml names and
  # goes through import-from-derivation to get them; a sandboxed derivation has
  # neither a network nor IFD, so this cannot be a `checks` entry at all. See
  # the header on packages.devenv-presets in flake.nix.
  #
  # Its own job because it is the only thing here that wants devenv.cachix.org:
  # without that substituter every preset compiles a toolchain from source and
  # the run stops being a CI job and starts being an afternoon.
  devenv-presets:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # A step-level `if:`, never a job-level one, and the difference was
      # measured rather than assumed: a job skipped by a job-level `if:`
      # reports conclusion `skipped`, which is not `success`, so a required
      # check blocks the merge exactly as a missing context does.
      # install-check.yml records the probe. So the job always runs and
      # completes green; its steps are what the gate turns off.
      - name: Nothing here can affect a build
        if: needs.gate.outputs.relevant != 'true'
        run: |
          echo "Only paths the gate excludes changed; not building." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5
        if: needs.gate.outputs.relevant == 'true'
      - uses: ./.github/actions/setup-nix
        if: needs.gate.outputs.relevant == 'true'
      - uses: cachix/cachix-action@v17
        if: needs.gate.outputs.relevant == 'true'
        # A cache upload failing must not fail a build that succeeded (#235).
        continue-on-error: true
        with:
          name: nixarchy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: devenv

      - name: Every preset still evaluates
        if: needs.gate.outputs.relevant == 'true'
        run: nix run .#devenv-presets

  omarchy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-nix
      - uses: cachix/cachix-action@v17
        # A cache upload failing must not fail a build that succeeded (#235).
        continue-on-error: true
        with:
          name: nixarchy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Cheap and the most informative single check: proves the vendored tree
      # assembles, shebangs patch, and the bin/ symlink farm is intact.
      - name: Build the vendored Omarchy tree
        run: nix build .#omarchy --print-build-logs

      - name: Verify the CLI sees its subcommands
        run: |
          # bin/omarchy discovers subcommands by grepping sibling scripts for
          # `# omarchy:summary=`. Wrapping the bins silently breaks this, and
          # the package still builds -- so assert on it rather than trust it.
          count=$(grep -l 'omarchy:summary=' result/share/omarchy/bin/* | wc -l)
          echo "commands with metadata: $count"
          test "$count" -gt 300

          # Upstream's own consistency check on that metadata -- it validates
          # every summary, arg spec and group, and is the thing that would
          # catch a bin we replace drifting out of the CLI's index.
          result/bin/omarchy commands --check

          # And that the README still quotes the number this reports. The
          # bound above is a floor, so the figure in the README drifted from
          # 438 to 429 across a source bump without anything noticing --
          # a floor catches a catastrophe, not a stale sentence.
          reported=$(result/bin/omarchy commands --check |
            sed -n 's/.*(\([0-9]*\) commands).*/\1/p')
          echo "omarchy commands --check reports: $reported"
          for claim in $(grep -oE '[0-9]+ (shell commands|subcommands)' README.md |
            grep -oE '^[0-9]+' | sort -u); do
            if [ "$claim" != "$reported" ]; then
              echo "README says $claim commands; the CLI reports $reported" >&2
              exit 1
            fi
          done

      # The README quotes app counts in four places. They are derivable from
      # data/apps.nix, and they silently went stale twice -- once when an app
      # was added, once when RetroArch moved to being built here -- so derive
      # them and fail rather than trust prose.
      - name: Every check is run by some workflow, on pull requests
        run: |
          # A check in `checks` that no workflow builds is worse than no check:
          # it reads like coverage, and the PR that adds it goes green without
          # it ever executing. checks.installer-ui shipped that way -- written
          # for #133, wired into the flake, run by nothing, green.
          #
          # WHO claims each check, rather than "is it named anywhere".
          #
          # This list is the opt-OUT. Everything not on it is built by the next
          # step, which derives its targets from the flake -- so adding a check
          # now runs it, with no YAML to write and nothing to forget. That
          # inversion is the point: `checks.<name> is defined but no workflow
          # runs it` fired four times in one day, every time because a check was
          # added and a step was not, and the gate can only ever report that
          # after the fact.
          #
          # These are the checks another job runs for a reason the generated
          # step cannot satisfy -- a bigger runner, KVM, a 90-minute budget, a
          # disk-free step, or a Hyprland closure that wants its own concurrency
          # group. Naming them here is a claim that is CHECKED below in both
          # directions, so the list cannot rot into fiction.
          # wifi-hwsim is a nixosTest and needs /dev/kvm. The generated step
          # runs in THIS job, which has no KVM setup -- the udev rule lives in
          # `box` -- so leaving it generated put a VM test in a job that cannot
          # boot one. The integration that added the check is what surfaced it.
          claimed="wifi-hwsim install free-space installer-refusal
            install-encrypted install-iso install-iso-net iso-budget microvm-boot
            box-boot box-template coexist dashboard-clock installer-ui
            installer-wizard integration microvm-template options plugin
            reference-toplevel session try-nixarchy vm-toplevel"

          # Two are covered by a path the grep below cannot see, and are listed
          # here rather than left to look accidental:
          #   omarchy                        built as `nix build .#omarchy`
          #   reference-unencrypted-toplevel pulled in by checks.install
          #   omarchy-runtime                built as `nix build .#omarchy-runtime`
          # (omarchy-runtime is the same derivation either way -- the checks
          # entry is an `inherit` of the package, so building the package IS
          # building the check.)
          exempt="omarchy omarchy-runtime reference-unencrypted-toplevel"

          # Collapsed to single spaces before anything tests membership.
          # `case " $claimed " in *" $c "*)` wants a space on BOTH sides, and
          # the list above is written across lines for readability -- so the
          # last name on every line was followed by a newline and matched
          # nothing. Four checks (installer-refusal, microvm-boot, installer-ui,
          # plugin) were silently added to the generated set while another job
          # already built them, and only the count not adding up showed it:
          # 24 generated + 22 claimed against 45 checks.
          claimed=$(printf '%s' "$claimed" | tr -s ' \n' ' ')

          # And the same hole one level up, which is #164. "Some workflow names
          # it" was never the whole question: a check named only by nightly.yml
          # satisfies that grep and still gates nothing, because nothing it can
          # catch arrives before the merge. That is #144 -- the install check
          # sat in exactly this position for most of this repo's life, and #123
          # shipped straight through it, green.
          #
          # These stay there deliberately, and the cost is the reason:
          #   install-iso  builds a 6 GB image and installs it -- ~3h
          #   iso-budget   measures that same image, so pays the same build
          #   install-iso-net  the same image build plus a closure fetch
          #   install-encrypted  an install-class VM with the same 85-minute
          #                    driver budget as checks.install; install-check.yml
          #                    already runs two of those against a 90-minute job
          #                    and that pair grazed the timeout on 2026-09-03
          #   microvm-boot     a nested VM on the -tcg runner
          nightly_only="install-iso iso-budget microvm-boot install-iso-net install-encrypted"

          # Ask Nix, do not parse the file.
          #
          # This used to be an awk range plus `grep -oE '^        [a-z]...'` --
          # EIGHT spaces of indentation. #299 added a `let ... in` around the
          # checks block, every entry moved to TEN, and the grep silently
          # matched nothing from that commit onward: the guard printed its
          # success line having extracted zero names.
          #
          # A guard that reads the source's LAYOUT rather than its VALUE fails
          # this way. `nix eval` cannot go stale when someone adds a binding.
          names=$(nix eval --raw \
            ".#checks.x86_64-linux" \
            --apply 'c: builtins.concatStringsSep "\n" (builtins.attrNames c)')

          # 20 is well under the current 45 and well over zero -- it catches
          # "extracted nothing" without needing maintenance every time a check
          # is added or removed.
          count=$(printf '%s\n' "$names" | grep -c . || true)
          if [ "${count:-0}" -lt 20 ]; then
            echo "::error::the check list came back with $count names, which is" \
                 "too few to be real -- this guard is not reading the flake" >&2
            exit 1
          fi

          # Every CLAIM, in both directions. A claimed check that no longer
          # exists is a stale list; a claimed check no workflow names is a job
          # that was deleted and a check that now runs nowhere -- and unlike
          # before, that one would be silent, because the generated step below
          # skips exactly what this list names.
          bad=""
          ungated=""
          for c in $claimed $exempt; do
            printf '%s\n' "$names" | grep -qx "$c" ||
              { bad="$bad $c:not-a-check"; continue; }
          done
          for c in $claimed; do
            # Already reported as not being a check at all; a second error
            # saying no workflow names it is true and adds nothing.
            case " $bad " in *" $c:"*) continue ;; esac

            # Not \b, which counts `-` as a boundary: `install` would match a
            # line naming `install-iso`.
            named=$(grep -rlE "checks\.x86_64-linux\.$c([^a-z0-9-]|\$)" .github/workflows/ || true)
            if [ -z "$named" ]; then bad="$bad $c:claimed-but-unrun"; continue; fi
            case " $nightly_only " in *" $c "*) continue ;; esac
            # Top-level `on:` key only. `pull_request` also appears in
            # install-check.yml as `github.event_name == 'pull_request'`.
            echo "$named" | xargs grep -lE '^  pull_request:' >/dev/null 2>&1 ||
              ungated="$ungated $c"
          done

          # ---- and that a conditional job is conditional on the GATE ----
          #
          # The three assertions above read `on:` triggers and grep for check
          # names. None of them looks at `if:`. So the moment a job that runs
          # claimed checks became conditional -- which is exactly what this
          # commit does to system, box, devenv-presets and apps -- the gate
          # kept reporting full coverage for checks that no longer run on
          # every pull request. A coverage gate that cannot see a skip is a
          # rubber stamp, and it would have been one silently.
          #
          # Rather than parse YAML in shell to work out which job owns which
          # check, this asserts the property that actually matters and is
          # cheap to state: EVERY condition in these two workflows must be one
          # of a known set. The set is the shared gate, its negation, and the
          # two deliberate exceptions. A new condition -- `github.actor ==`,
          # a label check, a hand-written path filter -- fails here and has to
          # be added on purpose, in a diff someone reviews, next to this
          # reasoning.
          #
          # That is the safety property for the whole skip scheme: every skip
          # in this repository is decided by one script
          # (.github/scripts/pr-touches-build.sh), so there is one denylist to
          # audit rather than a condition per job.
          allowed_ifs="needs.gate.outputs.relevant == 'true'
          needs.gate.outputs.relevant != 'true'
          always() && needs.gate.outputs.relevant == 'true'
          github.event_name != 'pull_request'"

          rogue=""
          # Process substitution, NOT a heredoc. The first version of this
          # used <<'CONDS' with a $(grep ...) inside it -- quoted, so the
          # command substitution never ran and the loop compared the literal
          # text of its own grep against the allowlist. It "failed" on every
          # run, describing its own source as a rogue condition. A pipe would
          # be just as wrong in the other direction: the loop would run in a
          # subshell and `rogue` would be empty afterwards, so it would pass
          # no matter what it read.
          while IFS= read -r cond; do
            [ -n "$cond" ] || continue
            printf '%s\n' "$allowed_ifs" | sed 's/^ *//' | grep -qxF "$cond" ||
              rogue="$rogue|$cond"
          done < <(grep -h "^[[:space:]]*if:" .github/workflows/build.yml \
                     .github/workflows/install-check.yml \
                   | sed 's/^[[:space:]]*if: //')

          # A floor. If the grep stops matching -- the key is renamed, the
          # files move -- this loop runs zero times and passes having checked
          # nothing, which is the failure it exists to prevent.
          conds_seen=$(grep -hc "^[[:space:]]*if:" .github/workflows/build.yml \
            .github/workflows/install-check.yml | paste -sd+ | bc)
          echo "conditions checked: $conds_seen"
          if [ "$conds_seen" -lt 5 ]; then
            echo "::error::found $conds_seen conditions in the workflows; expected at least 5." \
                 "The skip scheme is gated by if: expressions, so failing to see them" \
                 "means this assertion is checking nothing."
            exit 1
          fi

          if [ -n "$rogue" ]; then
            echo "::error::a workflow condition is not the shared gate:" \
                 "$(printf '%s' "$rogue" | tr '|' ' ')"
            echo "::error::every skip must be decided by .github/scripts/pr-touches-build.sh," \
                 "so there is one denylist to audit rather than one per job."
            exit 1
          fi

          if [ -n "$bad$ungated" ]; then
            for c in $bad; do
              case $c in
                *:not-a-check)
                  echo "::error::${c%%:*} is in the claimed list and is not a check in the flake" ;;
                *:claimed-but-unrun)
                  echo "::error::${c%%:*} is claimed by the list and named by no workflow --" \
                       "the generated step skips it, so it now runs nowhere" ;;
              esac
            done
            for c in $ungated; do
              echo "::error::checks.$c is claimed but run by no workflow that triggers on a pull request"
            done
            exit 1
          fi

          # What the next step builds: everything nobody claimed. Written to a
          # file rather than recomputed there, so the lists above are the single
          # place either step reads.
          : > /tmp/generated-checks
          for c in $names; do
            case " $claimed $exempt " in *" $c "*) continue ;; esac
            echo ".#checks.x86_64-linux.$c" >> /tmp/generated-checks
          done
          gen=$(grep -c . /tmp/generated-checks || true)
          if [ "${gen:-0}" -lt 5 ]; then
            echo "::error::only $gen checks would be built by the generated step;" \
                 "the claimed list has swallowed the flake" >&2
            exit 1
          fi
          echo "$gen checks are generated, $(printf '%s' "$claimed" | wc -w) are claimed elsewhere"

      - name: Build every check no other job claims
        run: |
          # The 20 steps this replaces were byte-identical except for the name:
          # `nix build .#checks.x86_64-linux.<x> --print-build-logs`, no setup,
          # no runner of their own. Maintaining that list by hand is what made
          # "checks.<name> is defined but no workflow runs it" the most repeated
          # CI failure in the repo -- four times in one day.
          #
          # One `nix build`, not a job matrix. A 20-job matrix pays 20 runner
          # spin-ups, 20 nix installs and 20 cachix setups to parallelise work
          # nix already parallelises internally, and turns four required status
          # contexts into twenty-four. --keep-going reports every failure in one
          # run rather than stopping at the first, which is what the matrix would
          # have been bought for.
          #
          # The list comes from the previous step, which owns the claimed/exempt
          # lists and has already verified them.
          mapfile -t targets < /tmp/generated-checks
          # mapfile returns 0 whatever the redirect did; an empty array here
          # would make this `nix build` with no installables, which builds
          # .#default and passes having checked nothing. The step before has a
          # floor of its own, and this is the second half of the same guard --
          # cheap, and the failure it prevents is a green run over no checks.
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "::error::no generated targets; refusing to build .#default and call it a pass" >&2
            exit 1
          fi
          printf 'building %s checks:\n' "${#targets[@]}"
          printf '  %s\n' "${targets[@]}"
          # --no-link, and it is load-bearing rather than tidy. This step runs
          # in the same job that builds .#omarchy into `result`, and later
          # steps read result/share/omarchy/bin. Without it, `nix build`
          # repoints `result` at the first of these checks and "Verify
          # shebangs were patched" inspects a completely different tree --
          # which is exactly how it failed. Nothing here wants an out-link;
          # the build IS the assertion.
          # Anything the cache can already vouch for is dropped first. This
          # step is the one that still runs on a docs-only pull request --
          # `omarchy` stays unconditional because it greps README.md for the
          # app and command counts -- so it is where the remaining minutes of
          # such a run are spent, on 26 checks a documentation edit cannot
          # change. A miss degrades safely: it builds.
          #
          # The targets go through as they are: the script accepts the
          # fully-qualified attr as well as a bare name, and every caller uses
          # the qualified form so the coverage gate above can still grep the
          # workflows for `checks.x86_64-linux.<name>`.
          .github/scripts/build-unless-proven.sh "${targets[@]}"

      # Not on pull requests, and this is the file's own doctrine finally
      # applied: the schedule comment at the top says a scheduled run is what
      # notices "the live issue list the roadmap check reads".
      #
      # It reads state no diff contains. Closing #159 -- correct, and with all
      # five children done -- turned every open pull request red at once, none
      # of which had touched the README. The author of an unrelated change
      # cannot fix that and should not be blocked by it.
      #
      # Still gated where it can act: every push to main, so a merge that
      # staled the roadmap is caught immediately, and weekly, so an issue
      # closed in the web UI is caught within seven days. What is given up is
      # catching it on the PR that closes the epic -- which is not where it
      # gets noticed anyway, because closing happens after the merge.
      - name: The README's roadmap still matches the open epics
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A roadmap nobody updates is worse than none: it is the section a
          # newcomer reads to judge whether the project is alive, and a stale
          # one says it is not. The README claims CI keeps this honest, so
          # this is that claim being true.
          #
          # Both directions. An epic opened and not listed means the roadmap
          # is incomplete; an epic listed and since closed means it is lying.
          # Only the table rows. The section also links a finished epic under
          # "Recently finished" and issues for context, and neither is a claim
          # about what is planned -- reading every link in the section flagged
          # the finished one as a lie the first time this ran.
          #
          # Sorted lexically on both sides, not numerically: comm compares by
          # collation, and `sort -n` on one side gives it input it says is
          # unsorted.
          open=$(gh issue list --state open --label epic --json number --jq '.[].number' | sort)
          roadmap=$(sed -n '/^## Roadmap/,/^## /p' README.md |
            grep -E '^\| \[#[0-9]+\]' | grep -oE 'issues/[0-9]+' | cut -d/ -f2 | sort -u)

          missing=$(comm -23 <(echo "$open") <(echo "$roadmap") || true)
          if [ -n "$missing" ]; then
            for n in $missing; do
              echo "::error::epic #$n is open and not in the README's Roadmap"
            done
            exit 1
          fi

          # A number in the roadmap that is not an open epic is either a
          # closed epic still advertised as planned, or a plain issue linked
          # for context. The second is fine, so only complain about epics.
          for n in $roadmap; do
            state=$(gh issue view "$n" --json state,labels \
              --jq 'select([.labels[].name] | index("epic")) | .state' 2>/dev/null || true)
            if [ "$state" = "CLOSED" ]; then
              echo "::error::epic #$n is closed but the Roadmap still lists it as planned"
              exit 1
            fi
          done
          echo "the roadmap names every open epic and no closed one"

      - name: Check the README's app counts still match data/apps.nix
        run: |
          eval "$(nix eval --raw --impure --expr '
            let lib = (builtins.getFlake (toString ./.)).inputs.nixpkgs.lib;
                a = import ./data/apps.nix;
                c = f: toString (lib.length (lib.attrNames (lib.filterAttrs f a)));
            in "total=" + toString (lib.length (lib.attrNames a))
             + " mod=" + c (_: x: x ? option)
             + " ours=" + c (_: x: x.ours or false)
             + " un=" + c (_: x: x ? unavailable)
          ')"
          nixpkgs=$(( total - mod - ours - un ))
          free=$(( nixpkgs + mod ))
          echo "total=$total nixpkgs=$nixpkgs modules=$mod ours=$ours unavailable=$un"

          fail=0
          check() { grep -qF "$1" README.md || { echo "::error::README is missing: $1"; fail=1; }; }
          # "in the selection", not "from Omarchy's menu": a preinstall like
          # obsidian is in data/apps.nix without a menuId, because upstream has
          # no per-app Install row for one either.
          check "| $total apps in the selection | $nixpkgs from nixpkgs, $mod as NixOS modules, $ours built here, $un with no equivalent |"
          check "**$free of the $total apps never touch this repo.**"
          check "| nixpkgs ($free of $total apps) | "
          exit $fail

      - name: Verify shebangs were patched
        run: |
          # Line 1 only. Several scripts legitimately contain `#!/bin/bash`
          # further down inside heredocs because they generate scripts, so
          # grepping whole files reports those as failures.
          #
          # Executables only: upstream ships two non-executable scripts
          # (omarchy-remove-service-{dropbox,tailscale}, mode 644) which
          # patchShebangs correctly skips and which cannot run on Arch either.
          unpatched=$(find result/share/omarchy/bin/ -type f -perm -u+x \
            -exec awk 'FNR==1 && /^#!\/bin\/(ba)?sh/ { print FILENAME }' {} +)
          if [ -n "$unpatched" ]; then
            echo "::error::unpatched shebangs: $unpatched"
            exit 1
          fi
          echo "all executable scripts patched"

      - name: Verify no bin touches pacman outside the allowlist
        run: |
          # This used to check seven named bins -- the ones the shell's QML
          # calls directly -- and nothing else. An enumeration like that
          # decays the expensive way: upstream adds an eighth pacman caller,
          # the seven still pass, and the new one ships silently. Same shape
          # as the coverage guard parsing indentation. So the scan now walks
          # EVERY executable bin and the enumeration is inverted into an
          # allowlist of the ones permitted to touch pacman/yay -- new
          # arrivals fail closed instead of passing unexamined.
          #
          # When this fires on a bin NOT in the list, upstream grew a new
          # package-management path, and someone must decide which of two
          # things it is -- the check cannot:
          #   - reachable on NixOS (a menu row modules/apps.nix does not
          #     override, a keybinding, the shell's QML, or a call from a bin
          #     we keep) -> it needs a replacement in pkgs/omarchy/nix-bin/,
          #     like the seven before it
          #   - Arch-only plumbing nothing here reaches -> add it to the
          #     allowlist below WITH the reason, the way each entry carries
          #     one now
          # An entry is a deliberate act with a diff and a reviewer; that is
          # the difference from the old list, which could only fail to grow.
          #
          # And so the allowlist cannot rot into matching nothing real, it is
          # loud in both directions: an entry whose bin went clean, or whose
          # bin the tree stopped shipping, fails until pruned.
          #
          # Seeded from the measured state of the 4.0.2 tree (every entry
          # below greps hot today). Reasons, grouped:
          #   - update/channel/keyring/mirror plumbing, unreachable because
          #     nix-bin replaces the entry points the UI calls (omarchy-update,
          #     omarchy-update-available): omarchy-channel-current,
          #     omarchy-channel-set, omarchy-refresh-pacman,
          #     omarchy-reinstall-pkgs, omarchy-update-aur-pkgs,
          #     omarchy-update-keyring, omarchy-update-orphan-pkgs,
          #     omarchy-update-system-pkgs{,-when-conflicted},
          #     omarchy-upgrade-to-quattro, omarchy-update-pacman-guard (its
          #     job is PRINTING advice about pacman)
          #   - menu rows modules/apps.nix overrides away: omarchy-pkg-remove
          #     (remove.package), omarchy-pkg-drop, omarchy-remove-dev-env,
          #     omarchy-remove-launcher-entry, omarchy-setup-security-fingerprint
          #   - reads pacman state for display only: omarchy-debug,
          #     omarchy-upload-log, omarchy-version-pkgs, omarchy-provision-owner,
          #     omarchy-dev-pkg-test (dev tooling)
          #   - OUR OWN nix-bin files whose pacman lines are heredoc prose or
          #     dead upstream code after an early exit, which comment-stripping
          #     cannot see: omarchy-migrate, omarchy-version,
          #     omarchy-version-channel
          allowed="omarchy-channel-current omarchy-channel-set omarchy-debug
            omarchy-dev-pkg-test omarchy-migrate omarchy-pkg-drop
            omarchy-pkg-remove omarchy-provision-owner omarchy-refresh-pacman
            omarchy-reinstall-pkgs omarchy-remove-dev-env
            omarchy-remove-launcher-entry omarchy-setup-security-fingerprint
            omarchy-update-aur-pkgs omarchy-update-keyring
            omarchy-update-orphan-pkgs omarchy-update-pacman-guard
            omarchy-update-system-pkgs omarchy-update-system-pkgs-when-conflicted
            omarchy-upgrade-to-quattro omarchy-upload-log omarchy-version
            omarchy-version-channel omarchy-version-pkgs"
          # The list wraps lines; the case patterns below match on single
          # spaces, so squeeze all whitespace first or the entry at each
          # line's end silently stops matching -- measured, nine of them did.
          allowed=$(printf '%s' "$allowed" | tr -s ' \n' ' ')

          fail=0
          scanned=0
          while IFS= read -r f; do
            name=$(basename "$f")
            scanned=$((scanned + 1))
            # Comments name pacman when explaining what upstream did, so only
            # comment-stripped lines count. Heredoc prose survives the strip
            # -- deliberately: a heredoc is what a script EMITS, and three
            # entries above exist because of exactly that.
            if sed 's/#.*//' "$f" | grep -qE '\bpacman\b|\byay\b'; then
              case " $allowed " in
                *" $name "*) ;;
                *)
                  echo "::error::$name touches pacman/yay and is not allowlisted. Either it is reachable on NixOS and needs a pkgs/omarchy/nix-bin/ replacement, or it is Arch-only plumbing and gets an allowlist entry with its reason -- see this step's comment."
                  fail=1
                  ;;
              esac
            else
              case " $allowed " in
                *" $name "*)
                  echo "::error::$name is allowlisted but no longer touches pacman/yay -- prune the entry, the list must track reality"
                  fail=1
                  ;;
              esac
            fi
          done < <(find result/share/omarchy/bin/ -type f -perm -u+x | sort)

          for a in $allowed; do
            [ -f "result/share/omarchy/bin/$a" ] || {
              echo "::error::the allowlist names $a, which the tree no longer ships -- prune the entry"
              fail=1
            }
          done

          # The old check's other half, its seven names now derived: every
          # replacement this port ships must keep the omarchy:summary= line
          # the CLI indexes on. Existence needs no assertion here -- the
          # build itself fails on a nix-bin file that replaces nothing.
          for b in pkgs/omarchy/nix-bin/*; do
            n=$(basename "$b")
            grep -q 'omarchy:summary=' "result/share/omarchy/bin/$n" || {
              echo "::error::$n lost its omarchy:summary= line; the CLI will not list it"
              fail=1
            }
          done

          # A scan that walked nothing would pass while checking nothing --
          # the coverage-guard failure, one directory over. The tree ships
          # hundreds of bins; a count this low means the path or the find is
          # wrong, not the tree.
          if [ "$scanned" -lt 300 ]; then
            echo "::error::only scanned $scanned bins, which is too few to be real -- this check is not reading the tree"
            fail=1
          fi

          [ "$fail" -eq 0 ] && echo "$scanned bins scanned: pacman confined to the allowlist, replacement metadata intact"
          exit "$fail"

      - name: Verify the browser lookup ignores $BROWSER
        run: |
          # `xdg-settings get default-web-browser` does not read the mime database
          # when $BROWSER is set: it treats $BROWSER as a command name and returns
          # the first .desktop whose Exec matches, which on a Chrome user's machine
          # is whichever web app sorts first. Every one of these scripts acts on the
          # answer, so an unguarded call sends web apps to the wrong browser.
          #
          # Upstream guards three of the four. If a bump adds a fifth caller, or
          # drops a guard, this is what says so.
          for b in omarchy-launch-webapp omarchy-launch-browser \
                   omarchy-default-browser omarchy-remove-browser; do
            f="result/share/omarchy/bin/$b"
            while IFS= read -r line; do
              case "$line" in
                *"env -u BROWSER xdg-settings get default-web-browser"*) ;;
                *"xdg-settings get default-web-browser"*)
                  echo "::error::$b reads default-web-browser without 'env -u BROWSER': $line"
                  exit 1 ;;
              esac
            done < "$f"
          done
          echo "browser lookups all ignore \$BROWSER"

      - name: Verify the agent skills are NixOS-aware
        run: |
          # omarchy-provision-user symlinks every directory here into
          # ~/.claude/skills, ~/.agents/skills, ~/.codex/skills and
          # ~/.pi/agent/skills, so this is what an AI agent on the machine is
          # told to do. Upstream ships Arch instructions; an Omarchy bump that
          # reworded a line we patch would put them back with nothing failing.
          skills=result/share/omarchy/default/agents/skills

          have=$(ls "$skills" | sort | tr '\n' ' ')
          [ "$have" = "devenv diagnose-crash nixarchy nixos nixos-ai nixos-config-repo nixos-doctor nixos-gpu nixos-performance nixos-secrets nixos-security nixos-services " ] || {
            echo "::error::unexpected skill set: $have"
            exit 1
          }

          # bin/omarchy-agent-crash reads this exact path, so the rename must
          # never reach it.
          test -f "$skills/diagnose-crash/SKILL.md" || {
            echo "::error::omarchy-agent-crash reads diagnose-crash/SKILL.md; it is gone"
            exit 1
          }

          for d in "$skills"/*/; do
            name=$(basename "$d")
            fm=$(sed -n 's/^name: //p' "$d/SKILL.md" | head -1)
            [ "$fm" = "$name" ] || {
              echo "::error::$name/SKILL.md declares name: $fm; agents key on the directory"
              exit 1
            }
          done

          # Prose may contrast with Arch on purpose ("upstream runs pacman -S,
          # here the menu edits apps.nix") -- that comparison is the point. What
          # must never appear is an Arch command inside a fenced block, because
          # that is what an agent copies and runs.
          bad=$(find "$skills" -name '*.md' -print0 | xargs -0 awk '
            /^```/ { fence = !fence; next }
            # pre-refresh-pacman.d is a hook DIRECTORY name, not a command, and
            # the line already says it never runs here. Named, not counted.
            fence && /pre-refresh-pacman\.d/ { next }
            fence && /pacman|[^n]yay |\/usr\/share\/omarchy|debuginfod\.archlinux\.org/ {
              printf "%s:%d: %s\n", FILENAME, FNR, $0
            }')
          if [ -n "$bad" ]; then
            echo "::error::Arch commands inside skill code blocks:"
            echo "$bad"
            exit 1
          fi
          echo "agent skills are NixOS-aware"

      - name: Verify every app's attr resolves to a real package
        run: |
          # nixarchy-doctor and the Install menu both ask pkgs for an app's
          # meta.mainProgram to learn which command it puts on PATH, and fall
          # back to the attribute name when the lookup fails. That fallback is
          # right by luck when the attribute matches the binary and wrong when
          # it does not -- it answered `zen` for a package installing zen-beta
          # and `hey-cli` for one installing hey, so both were reported absent
          # on machines that had them.
          #
          # A silent fallback is the whole problem, so make an unresolvable
          # attr loud. Entries carrying `option` are NixOS modules rather than
          # packages and have no attr to resolve; `unavailable` ones have no
          # nixpkgs equivalent at all.
          nix eval --impure --raw --expr '
            let
              f = builtins.getFlake (toString ./.);
              lib = f.inputs.nixpkgs.lib;
              pkgs = import f.inputs.nixpkgs {
                localSystem = "x86_64-linux";
                overlays = [ f.overlays.default ];
              };
              apps = import ./data/apps.nix;
              usable = lib.filterAttrs (_: a: !(a ? unavailable) && !(a ? option)) apps;
              resolves =
                name: app:
                let
                  path = lib.splitString "." (app.attr or name);
                  probe = builtins.tryEval (
                    lib.attrByPath path (lib.attrByPath path null pkgs) pkgs.nixarchy-apps
                  );
                in
                probe.success && probe.value != null;
              broken = lib.attrNames (lib.filterAttrs (n: a: !(resolves n a)) usable);
            in
            lib.concatStringsSep " " broken
          ' > /tmp/broken-attrs

          broken=$(cat /tmp/broken-attrs)
          if [ -n "$broken" ]; then
            echo "::error::these data/apps.nix entries name an attr nothing provides:$broken"
            exit 1
          fi
          echo "every app attr resolves to a package"

      - name: Verify every Install row is mapped
        run: |
          # data/apps.nix claims CI keeps it from rotting. This is that check,
          # and omarchy.yml runs the same script against the newest Omarchy --
          # it used to run its own copy, which drifted and failed on a row
          # that was mapped. See the script's header.
          python3 .github/scripts/check-menu-mapping.py \
            result/share/omarchy/default/omarchy/omarchy-menu.jsonc \
            data/apps.nix data/services.nix

      - name: Verify every mapped app still evaluates
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
          NIXPKGS_ALLOW_BROKEN: "0"
        run: |
          # An app that nixpkgs marks broken aborts the user's whole rebuild,
          # not just its own install -- sublimetext4 did exactly that. Catch it
          # here instead of in someone's nixos-rebuild.
          # From the data, not a grep: `ours` packages are ones nixpkgs does
          # not carry, so testing them against nixpkgs would always fail.
          attrs=$(nix eval --raw --impure --expr '
            let a = import ./data/apps.nix;
                want = builtins.filter (v: (v ? attr) && !(v.ours or false))
                         (builtins.attrValues a);
            in builtins.concatStringsSep " " (map (v: v.attr) want)')
          # --inputs-from ., so `nixpkgs#` means THIS repository's pinned
          # nixpkgs and not the runner's flake registry.
          #
          # The registry resolves to a channel that moves daily, so this step
          # was answering a different question from the one it asks: whether
          # an app evaluates against some nixpkgs nobody here uses. Two costs,
          # and the second is the worse one. A package going broken upstream
          # reddened every open pull request, for a reason present in none of
          # their diffs. And a package broken in OUR pin -- the one users
          # actually rebuild against -- would pass here as long as the channel
          # had already fixed it.
          bad=""
          for a in $attrs; do
            nix eval --inputs-from . --impure --raw "nixpkgs#$a.name" \
              >/dev/null 2>&1 || bad="$bad $a"
          done
          if [ -n "$bad" ]; then
            echo "::error::these mapped packages do not evaluate:$bad"
            exit 1
          fi
          echo "all $(echo "$attrs" | wc -w) mapped packages evaluate"

      - name: Verify runtime commands resolve
        run: |
          # The bins are unwrapped on purpose, so an incomplete runtimeDeps
          # list produces a package that builds cleanly and then fails at the
          # click -- which is how `Command not found: xdg-terminal-exec`
          # shipped while the bar itself rendered fine.
          nix build .#omarchy-runtime --print-build-logs
          missing=""
          for cmd in xdg-terminal-exec uwsm-app foot hyprctl quickshell jq gum \
                     wl-copy grim slurp brightnessctl pactl wpctl nmcli \
                     bluetoothctl notify-send mise nvim gtk-launch udiskie \
                     git less man unzip pamixer imv magick rg zbarimg \
                     inotifywait starship zoxide eza lazygit; do
            [ -x "result/bin/$cmd" ] || missing="$missing $cmd"
          done
          if [ -n "$missing" ]; then
            echo "::error::runtimeDeps does not provide:$missing"
            exit 1
          fi
          echo "all checked runtime commands resolve ($(ls result/bin | wc -l) binaries)"

      - name: Verify every desktop entry's command resolves
        run: |
          # The step above checks a hand-written list of command names. That
          # list was built by grepping bin/, so a command referenced only by a
          # .desktop file is invisible to it -- which is how "Disk Usage"
          # shipped launching `dua`, opening a terminal that closed instantly.
          #
          # This derives the commands from the entries themselves, so a new
          # launcher row in a future Omarchy release cannot introduce the same
          # failure silently.
          nix build .#omarchy --out-link result-omarchy
          nix build .#omarchy-runtime --out-link result-runtime

          missing=""
          for f in result-omarchy/share/omarchy/applications/*.desktop; do
            exec_line=$(sed -n 's/^Exec=//p' "$f" | head -1)
            # Either `bash -c "cmd ..."` or a plain command as the first word.
            cmd=$(printf '%s' "$exec_line" | sed -n 's/.*bash -c "\([a-zA-Z0-9_.-]*\).*/\1/p')
            [ -z "$cmd" ] && cmd=$(printf '%s' "$exec_line" | awk '{print $1}')
            [ -z "$cmd" ] && continue
            # Omarchy's own bins live in the package; everything else must come
            # from runtimeDeps.
            if [ ! -x "result-omarchy/bin/$cmd" ] && [ ! -x "result-runtime/bin/$cmd" ]; then
              missing="$missing $cmd($(basename "$f" .desktop))"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::desktop entries launch commands nothing provides:$missing"
            exit 1
          fi
          echo "every desktop entry's command resolves"

      - name: Verify the generated menu defaults and app template
        run: |
          nix build .#nixosConfigurations.vm.config.system.build.toplevel \
            --print-build-logs -o result-sys

          # Omarchy's menu parser returns [] on a JSON error rather than
          # complaining, so a malformed extension is silently ignored and every
          # Install row quietly reverts to running pacman. Parse it here the
          # same way MenuModel.js does.
          python3 - <<'PY'
          import re, json, sys
          raw = open("result-sys/etc/nixarchy/omarchy-menu.jsonc").read()
          s = re.sub(r'^\s*//[^\n]*(\n|$)', '', raw, flags=re.M)   # stripJsonc
          s = re.sub(r',(\s*[}\]])', r'\1', s)
          try:
              rows = json.loads(s)
          except Exception as e:
              sys.exit(f"::error::menu extension is not valid JSONC: {e}")
          wired = [k for k, v in rows.items()
                   if str(v.get("action", "")).startswith("nixarchy-app-enable")]
          if len(wired) < 20:
              sys.exit(f"::error::only {len(wired)} install rows wired to nixarchy-app-enable")
          if rows.get("install.aur", {}).get("when") != "false":
              sys.exit("::error::install.aur is not hidden; there is no AUR on NixOS")
          # Every row must carry a real label. MenuModel.js normalizes an
          # override before merging (`label: value.label || id`) and then
          # copies all its keys over the default, so a row that omits a label
          # does not inherit upstream's -- it renders the raw id, and the menu
          # reads "install.editor.vscode" instead of "VSCode".
          unlabelled = [k for k, v in rows.items() if not v.get("label")]
          if unlabelled:
              sys.exit(f"::error::menu rows with no label: {unlabelled}")
          idlike = [k for k, v in rows.items() if v.get("label") == k]
          if idlike:
              sys.exit(f"::error::menu rows whose label is their id: {idlike}")
          # Same trap as the label: an override that omits `action` does not
          # inherit upstream's, it blanks it, and the row silently does
          # nothing when clicked.
          #
          # A submenu parent is the exception, and it is implicit: nothing in
          # the row says "I have children", the children just carry ids
          # prefixed with the parent's. So `install` legitimately has no
          # action, because `install.editor` exists. This file is the whole
          # merged menu rather than only our overrides, so those parents are
          # now in it -- and checking for children is what tells them apart
          # from a row that really does nothing.
          ids = set(rows)
          dead = [k for k, v in rows.items()
                  if not v.get("action") and not v.get("when")
                  and not v.get("target") and not v.get("provider")
                  and not any(o.startswith(k + ".") for o in ids)]
          if dead:
              sys.exit(f"::error::menu rows with no action and no submenu: {dead}")
          print(f"menu OK: {len(rows)} rows, {len(wired)} wired, all labelled and actionable")
          PY

          # The template is Nix that gets imported into the user's flake; if it
          # does not parse, first login hands them a broken config.
          nix-instantiate --parse result-sys/etc/nixarchy/apps-template.nix >/dev/null
          echo "app template parses"

  # The opt-in applications, built so nobody else has to.
  #
  # Every other job here builds a system or a check, and an app nobody enables
  # by default is in neither -- so programs.nixarchy.apps.aether meant a Go
  # toolchain, an npm tree and a webkit link on the user's own laptop, every
  # time. Nothing was wrong; nothing had ever pushed them.
  #
  # The list is read from data/apps.nix rather than written here, because a
  # hand-copied list of nine names is a list that silently stops covering the
  # tenth. `ours = true` is the same flag the Install menu uses to decide an
  # app comes from this flake instead of nixpkgs, which is exactly the set that
  # has no cache anywhere else.
  #
  # The nixpkgs-derived ones in that set (retroarch, zen-browser) cost close to
  # nothing: they substitute from cache.nixos.org rather than build.
  apps:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # A step-level `if:`, never a job-level one, and the difference was
      # measured rather than assumed: a job skipped by a job-level `if:`
      # reports conclusion `skipped`, which is not `success`, so a required
      # check blocks the merge exactly as a missing context does.
      # install-check.yml records the probe. So the job always runs and
      # completes green; its steps are what the gate turns off.
      - name: Nothing here can affect a build
        if: needs.gate.outputs.relevant != 'true'
        run: |
          echo "Only paths the gate excludes changed; not building." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5
        if: needs.gate.outputs.relevant == 'true'
      - uses: ./.github/actions/setup-nix
        if: needs.gate.outputs.relevant == 'true'
      - uses: cachix/cachix-action@v17
        if: needs.gate.outputs.relevant == 'true'
        # A cache upload failing must not fail a build that succeeded (#235).
        continue-on-error: true
        with:
          name: nixarchy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build every app the flake ships itself
        if: needs.gate.outputs.relevant == 'true'
        env:
          # grok-bot is unfree, and a bare `nix build` refuses to evaluate it.
          # The same pair the menu-mapping job above uses, for the same
          # reasons: unfree is allowed because the app selection offers unfree
          # apps, and broken is NOT, because a package nixpkgs marks broken
          # aborts the user's whole rebuild rather than just its own install.
          NIXPKGS_ALLOW_UNFREE: "1"
          NIXPKGS_ALLOW_BROKEN: "0"
        run: |
          mapfile -t attrs < <(nix eval --raw --impure --expr '
            let
              cat = import ./data/apps.nix;
              ours = builtins.filter (n: (cat.${n}.ours or false)) (builtins.attrNames cat);
            in builtins.concatStringsSep "\n" (map (n: cat.${n}.attr or n) ours)
          ')

          # A floor, because `nix build` over an empty list exits 0 and would
          # turn "the catalogue stopped parsing" into a green job.
          echo "apps to build: ${#attrs[@]}"
          test "${#attrs[@]}" -ge 8

          # --impure because NIXPKGS_ALLOW_UNFREE is an environment variable,
          # and a pure evaluation cannot see it.
          nix build --impure --keep-going --no-link --print-build-logs \
            "${attrs[@]/#/.#}"

  system:
    needs: gate
    runs-on: ubuntu-latest
    # 45, not 30. The job's own work is ~20 minutes (see below), so 30 looked
    # like ample headroom until 2026-09-04, when a cache.nixos.org stall of
    # 21-24 minutes hit four independent runners inside the same wall-clock
    # window -- three of them blocked on the identical obs-studio store path.
    # Every one of those runs died at the cap with its builds already green,
    # and four PRs sat unmergeable behind an outage in somebody else's CDN.
    # This cap exists to fail a hung job in half an hour rather than six
    # (411c6a4); 45 still does that, while surviving a substituter blip.
    timeout-minutes: 45
    # Its own concurrency group, and NOT cancel-in-progress. This job builds
    # Hyprland from source and takes ~20 minutes, so under the workflow-level
    # cancel-in-progress it is killed by any push landing within that window
    # -- which meant the most valuable check in this workflow routinely never
    # completed. Queue it behind the previous one instead of discarding it.
    #
    # Per commit on main, for the same reason the workflow-level group above
    # is: cancel-in-progress: false stops a RUNNING job being killed and does
    # nothing about a PENDING one, which GitHub cancels as soon as a newer run
    # queues into the group. Under a burst of merges this job -- the most
    # expensive and most valuable in the workflow -- reported for the first
    # and last commit and nothing between.
    concurrency:
      group: >-
        ${{ github.workflow }}-system-${{ github.ref }}-${{
          github.ref == 'refs/heads/main' && github.sha || 'shared' }}
      cancel-in-progress: false
    steps:
      # A step-level `if:`, never a job-level one, and the difference was
      # measured rather than assumed: a job skipped by a job-level `if:`
      # reports conclusion `skipped`, which is not `success`, so a required
      # check blocks the merge exactly as a missing context does.
      # install-check.yml records the probe. So the job always runs and
      # completes green; its steps are what the gate turns off.
      - name: Nothing here can affect a build
        if: needs.gate.outputs.relevant != 'true'
        run: |
          echo "Only paths the gate excludes changed; not building." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5
        if: needs.gate.outputs.relevant == 'true'
      - uses: ./.github/actions/setup-nix
        if: needs.gate.outputs.relevant == 'true'
      - uses: cachix/cachix-action@v17
        if: needs.gate.outputs.relevant == 'true'
        # A cache upload failing must not fail a build that succeeded (#235).
        continue-on-error: true
        with:
          name: nixarchy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Free disk space
        if: needs.gate.outputs.relevant == 'true'
        # Hyprland plus a full desktop closure does not fit in the default
        # runner alongside the preinstalled toolchains.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /


      - name: Build the VM system closure
        if: needs.gate.outputs.relevant == 'true'
        run: .github/scripts/build-unless-proven.sh .#checks.x86_64-linux.vm-toplevel

      - name: Build the installed-machine closure
        if: needs.gate.outputs.relevant == 'true'
        # The reference host: what the installer produces, with a real
        # bootloader and disko filesystems. Built here so the install path
        # cannot rot unnoticed between releases.
        run: .github/scripts/build-unless-proven.sh .#checks.x86_64-linux.reference-toplevel

      - name: Read a MicroVM runner without booting it
        if: needs.gate.outputs.relevant == 'true'
        # checks.microvm-template: what hypervisor, whether the store is
        # shared or imaged, whether the network needs root -- read off the
        # built package and qemu command line, plus nixarchy-vm's launch and
        # locking behaviour against a stub `nix`. Also how the templates
        # reach nixarchy.cachix.org: cachix-action above pushes what this
        # job builds.
        run: .github/scripts/build-unless-proven.sh .#checks.x86_64-linux.microvm-template

      - name: Read a box template without pulling it online
        if: needs.gate.outputs.relevant == 'true'
        # checks.box-template: the catalogue INI names a real, pinned image
        # (pulled as a fixed-output derivation, network allowed because the
        # hash -- not the sandbox -- makes it reproducible), and nixarchy
        # box never resolves distrobox through a /nix/store path.
        run: .github/scripts/build-unless-proven.sh .#checks.x86_64-linux.box-template

      - name: Drive a session and the app-selection loop
        if: needs.gate.outputs.relevant == 'true'
        # Boots a machine, picks two apps through nixarchy-app-enable, checks
        # the file still parses, and checks nixarchy-apply copies the
        # selection into the flake. Nothing else here proves that the Install
        # menu actually installs anything.
        run: .github/scripts/build-unless-proven.sh .#checks.x86_64-linux.session

      # Both of these were written after three bugs shipped that every other
      # check here was blind to -- and then nothing ran them, which is how the
      # gap they exist to close stayed open a second time.
      - name: Check every option both ways
        if: needs.gate.outputs.relevant == 'true'
        # Cheap: evaluated, not booted. Each option here does its work by
        # putting a package in a list, so evaluation is where the answer is.
        run: .github/scripts/build-unless-proven.sh .#checks.x86_64-linux.options

      - name: Build onto a config that already exists
        if: needs.gate.outputs.relevant == 'true'
        # An overridden package, its own Hyprland, greetd already greeting.
        # Built rather than evaluated: a desktop file colliding with a real
        # package, two nixpkgs instances, and runtime dependencies in two
        # profiles at once are none of them evaluation errors.
        run: .github/scripts/build-unless-proven.sh .#checks.x86_64-linux.integration

      - name: Boot the Omarchy session beside another Hyprland
        if: needs.gate.outputs.relevant == 'true'
        # A foreign hyprland.lua in place, the session started from its own
        # .desktop, and the desktop asserted to render -- the arrangement the
        # README tells people with an existing Hyprland to use.
        run: .github/scripts/build-unless-proven.sh .#checks.x86_64-linux.coexist

      - name: The installer's screens draw at every width
        if: needs.gate.outputs.relevant == 'true'
        # checks.installer-ui was added with #133 and then run by nothing: it
        # went into `checks` and into no workflow, so the PR that introduced it
        # went green without it ever executing. A check nobody runs is worse
        # than no check, because it reads like coverage.
        run: .github/scripts/build-unless-proven.sh .#checks.x86_64-linux.installer-ui

      - name: The no-nix front door refuses in sentences
        if: needs.gate.outputs.relevant == 'true'
        # installer/try-nixarchy.sh is for somebody on Ubuntu or Fedora with
        # no nix, so almost all of it is refusals -- and a refusal nobody has
        # watched fire is a refusal nobody knows works. Counterpart to
        # try-preflight, which does this for the `nix run …#try` door.
        run: .github/scripts/build-unless-proven.sh .#checks.x86_64-linux.try-nixarchy

      - name: The install dashboard survives a rewound clock
        if: needs.gate.outputs.relevant == 'true'
        # The VM install checks cannot catch this: their clocks are stable, so
        # every duration they compute is positive. On a real machine the RTC is
        # wrong, the installer asks for a timezone, NTP corrects it mid-install
        # and `now - UI_DASH_START` goes negative -- which fed sed a negative
        # line number and drew its usage text over the installer.
        run: .github/scripts/build-unless-proven.sh .#checks.x86_64-linux.dashboard-clock

      - name: Answer the installer's questions
        if: needs.gate.outputs.relevant == 'true'
        # The interactive path, which every other harness skips by passing
        # --answers: the greeter, the six questions, the two validators and the
        # summary, typed at over a serial line. --dry-run, so it costs about
        # half a minute of test script rather than the install checks.install
        # already covers.
        run: .github/scripts/build-unless-proven.sh .#checks.x86_64-linux.installer-wizard

      - name: Add third-party plugins from real repos
        if: needs.gate.outputs.relevant == 'true'
        # `omarchy plugin add <url> --enable` for two published plugins, then
        # disable and remove. The plugin system is the one deliberately
        # imperative corner of Omarchy -- it clones into ~/.config at runtime
        # -- so what this proves is that the seed leaves that directory
        # writable and the shell's IPC is reachable.
        run: .github/scripts/build-unless-proven.sh .#checks.x86_64-linux.plugin

  # PROPOSED CI-GATE CHANGE (AGENTS.md 4 and 11): this job is new gate wiring,
  # merged by a human, not an agent.
  #
  # Creates and enters a real box inside a NixOS test VM -- see
  # tests/box-boot.nix. Its own job rather than a step in `system`: that
  # job's 30-minute budget is already mostly spent, and this needs /dev/kvm
  # arranged first, which no step there does.
  box:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A step-level `if:`, never a job-level one, and the difference was
      # measured rather than assumed: a job skipped by a job-level `if:`
      # reports conclusion `skipped`, which is not `success`, so a required
      # check blocks the merge exactly as a missing context does.
      # install-check.yml records the probe. So the job always runs and
      # completes green; its steps are what the gate turns off.
      - name: Nothing here can affect a build
        if: needs.gate.outputs.relevant != 'true'
        run: |
          echo "Only paths the gate excludes changed; not building." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v5
        if: needs.gate.outputs.relevant == 'true'
      - uses: ./.github/actions/setup-nix
        if: needs.gate.outputs.relevant == 'true'
      - uses: cachix/cachix-action@v17
        if: needs.gate.outputs.relevant == 'true'
        # A cache upload failing must not fail a build that succeeded (#235).
        continue-on-error: true
        with:
          name: nixarchy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: /dev/kvm is real and writable, or fail here
        if: needs.gate.outputs.relevant == 'true'
        # ubuntu-latest runners have /dev/kvm, but root:kvm 0660 and the nix
        # build users are not in `kvm`; the udev rule is GitHub's own
        # documented fix. Loud rather than falling back: without a usable
        # /dev/kvm the test driver would run the node under TCG and this job
        # would quietly get slower until it started flapping against its
        # timeout -- fail on day one instead.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          grep -Eq 'vmx|svm' /proc/cpuinfo || { echo "::error::no vmx/svm in /proc/cpuinfo"; exit 1; }
          test -w /dev/kvm || { echo "::error::/dev/kvm is not writable"; exit 1; }
          ls -l /dev/kvm

      # Here rather than in the generated batch, and the integration is what
      # showed why: it is a nixosTest and needs the /dev/kvm the step above
      # sets up. The generated step runs in the `omarchy` job, which has no
      # KVM, so a VM test landed in a job that cannot boot one -- a bespoke
      # need, which is exactly what the claimed list is for.
      - name: A VM with a radio can associate to a network
        if: needs.gate.outputs.relevant == 'true'
        run: .github/scripts/build-unless-proven.sh .#checks.x86_64-linux.wifi-hwsim

      - name: Create a box offline, and pin what enter does without a network
        if: needs.gate.outputs.relevant == 'true'
        # checks.box-boot: the pinned image is preloaded from the store
        # (dockerTools.pullImage is fixed-output), `nixarchy box create` runs
        # end to end as a rootless user, the recorded distrobox-init mount is
        # not a /nix/store path (nixpkgs#478154), and the first offline
        # `distrobox enter` fails loudly at the entrypoint -- the measured
        # answer to the epic's open first-start question, asserted as
        # observed. See tests/box-boot.nix.
        run: .github/scripts/build-unless-proven.sh .#checks.x86_64-linux.box-boot
