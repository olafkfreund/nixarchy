name: release

# A tag becomes something a person can download and write to a USB stick.
#
# Until now a release here has meant a git ref: the tag *is* the release, and
# what you do with it is pin a flake input. An ISO changes that. It is five and
# a half gigabytes that somebody downloads once and then trusts to overwrite
# their disk, so it has to come from a tag, be built by a machine rather than a
# laptop, and carry a checksum that was produced by the same run that produced
# the image.
#
# This runs on p510 for the same reason nightly.yml does: a hosted runner has
# 14 GB of disk, and the image alone is more than a third of that before the
# 15.3 GB closure it carries. It deliberately mirrors nightly.yml rather than
# build.yml -- no installer action, no cachix, because the runner is a NixOS
# machine with a warm store. nightly.yml is the job that actually builds and
# boots this image every night; if the release recipe drifts from anything, it
# should be from that one.

on:
  push:
    tags: ["v*"]

  # Because a release that is lost has to be recoverable without tag surgery.
  #
  # Four attempts failed before one published, and none of them failed on the
  # image: a deploy restarted the runner mid-job, both runners lost their
  # connection to GitHub while the machine carried on building, one ran out of
  # the five hours it was given, and one run simply disappeared from the
  # history with the tag still in place and nothing running.
  #
  # With `push: tags` as the only trigger there is no way to say "try that
  # again". Re-running the old run replays the workflow as it was at that
  # tag's commit, which is the wrong version once the workflow itself has been
  # fixed, and deleting and re-pushing a tag is a thing to be careful with
  # once anyone might have pinned it. So: a button.
  #
  # Takes the tag to build. It must exist and it must already point at the
  # commit you want -- this re-runs a release, it does not create one.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish, e.g. v4.0.1-5"
        required: true
        type: string

permissions:
  contents: write
  # --discussion-category on the publish step below opens an Announcements
  # discussion for the release. Without this the whole `gh release create`
  # call fails, taking the release with it -- the discussion is the smaller
  # half and must not be able to cost the larger one.
  discussions: write

# Never cancel a release mid-upload. A half-attached release is worse than a
# late one, and two tags pushed together should queue rather than race.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  iso:
    name: build and publish the ISO
    runs-on: [self-hosted, nixos, kvm, big]
    # Two ISO builds, then splitting and uploading 5.6 GB. Was 300 minutes
    # when this also installed from the image; that step moved to the nightly,
    # and a smaller window is part of the point -- a job that cannot finish in
    # ninety minutes has gone wrong rather than gone slowly.
    timeout-minutes: 90
    steps:
      # On a tag push this is the tag already. On a dispatch the default ref
      # is the branch, so the tag has to be named explicitly or the release
      # would be built from main and published under a tag's name.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          # The notes below are derived from the range between this tag and the
          # one before it, which a depth-1 checkout does not contain: there is
          # no previous tag to name and no commit to read. Whole history, and
          # the tags with it.
          fetch-depth: 0

      - name: The tag names the Omarchy the flake vendors
        run: |
          # v4.0.1-2 -> 4.0.1. The suffix counts our packaging revisions
          # against an unchanged upstream, so only the first component is a
          # claim about Omarchy.
          vendored=$(nix eval --raw .#packages.x86_64-linux.omarchy.version)
          # GITHUB_REF_NAME is the tag on a push and the BRANCH on a dispatch,
          # so every use of it -- this guard, the asset names, the release
          # itself -- has to go through the input when there is one.
          tag="${{ inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          tagged=${tag#v}
          tagged=${tagged%-*}
          if [ "$vendored" != "$tagged" ]; then
            echo "::error::tag $tag claims Omarchy $tagged, the flake vendors $vendored"
            exit 1
          fi
          echo "omarchy=$vendored" >> "$GITHUB_OUTPUT"
        id: version

      # --out-link, not --no-link: the result is a GC root for the rest of the
      # job. An ISO collected between building it and uploading it would fail
      # in a way that took an afternoon to understand.
      - name: Build the ISO
        run: nix build .#iso --out-link result --print-build-logs

      # The smaller image, for people who would rather download 1.5 GB and let
      # the install fetch the rest. Not separately install-tested: it shares
      # every line of the installer with the image below, and what differs --
      # downloading rather than copying -- is what checks.install already does.
      - name: Build the network ISO
        run: nix build .#iso-net --out-link result-net --print-build-logs

      # checks.install-iso is deliberately NOT here, and the reasoning is
      # about survivability rather than about trusting the image less.
      #
      # It boots the 5.6 GB image and installs a desktop from it, which takes
      # about an hour, and it ran here because "the image nobody boots is the
      # image that does not boot". That argument is right and this still holds
      # it: the nightly runs the same check, against the same expression, on
      # the same machine.
      #
      # What changed is the measured cost of a long release. On 2026-09-01 two
      # release attempts died before publishing anything -- one when a deploy
      # restarted the runner mid-job, one when both runners lost their
      # connection to GitHub while p510 carried on building (the runner
      # afterwards logged the job as Succeeded, eight minutes after GitHub had
      # given up on it). Neither was a fault in the image or in this workflow.
      # A four-hour job is simply a large target: anything that interrupts it
      # discards four hours and publishes nothing.
      #
      # Twenty minutes of building is a target small enough to hit. The image
      # is still install-tested every night, and a tag is cut from a commit
      # that has been on main -- so in practice the ISO published here is one
      # the nightly has already booted.
      #
      # If that stops being true -- if tags start being cut faster than
      # nightlies run -- this decision is worth revisiting.

      - name: Split it into pieces GitHub will accept
        id: split
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # GitHub caps a single release asset at 2 GiB and there is no limit
          # on a release's total size, so the image ships in parts. 1900 MiB
          # leaves room under the cap without making a fourth part likely.
          iso=$(echo result/iso/*.iso)
          net=$(echo result-net/iso/*.iso)
          base="nixarchy-${TAG}.iso"
          netbase="nixarchy-${TAG}-net.iso"
          rm -rf out && mkdir out
          split -b 1900M -- "$iso" "out/$base.part-"

          # The network image is 1.5 GiB and ships whole. Only the image that
          # cannot fit gets taken apart.
          cp -- "$net" "out/$netbase"

          # One SHA256SUMS covering the parts *and* the assembled image, so a
          # single `sha256sum -c` after reassembly checks both the download and
          # the cat that put it back together. Checked in that order, because
          # the image does not exist until the user makes it.
          (
            cd out
            sha256sum "$base".part-* > SHA256SUMS
            # Hashed from stdin so the store path never reaches the file, and
            # the name is printed rather than edited in. Rewriting the path out
            # of sha256sum's own output with sed is greedy and eats the hash
            # too, which produces a line `sha256sum -c` calls "improperly
            # formatted", skips, and still exits 0 -- a checksum file that
            # reports PASS without having checked the image.
            printf '%s  %s\n' \
              "$(sha256sum < "$OLDPWD/$iso" | cut -d' ' -f1)" "$base" >> SHA256SUMS
            sha256sum "$netbase" >> SHA256SUMS
          )

          {
            echo "iso=$base"
            echo "netiso=$netbase"
            echo "size=$(du -h "$iso" | cut -f1)"
            echo "netsize=$(du -h "$net" | cut -f1)"
            echo "parts=$(find out -name "$base.part-*" | wc -l)"
          } >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        env:
          OMARCHY: ${{ steps.version.outputs.omarchy }}
          ISO: ${{ steps.split.outputs.iso }}
          SIZE: ${{ steps.split.outputs.size }}
          NETISO: ${{ steps.split.outputs.netiso }}
          NETSIZE: ${{ steps.split.outputs.netsize }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # What actually changed, first. Everything below this is about the
          # download; this part is about the machine, and it is the half a
          # person deciding whether to upgrade came for.
          #
          # The previous tag is the nearest one reachable from this commit --
          # not the newest tag in the repository, which on a re-run of an old
          # release would be a tag from the future.
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          : > notes.md
          if [ -z "$previous" ]; then
            echo "::warning::no tag before $TAG; publishing without notes"
          elif nix run .#release-notes -- "$previous" "$TAG" > derived.md; then
            cat derived.md >> notes.md
            printf '\n' >> notes.md
          else
            # Not fatal. The image is built and the checksums are real; what is
            # missing is the summary, and saying so is better than either
            # discarding the release or publishing a page that implies nothing
            # changed. build.yml runs checks.release-notes on every pull
            # request, so this should have been caught long before a tag.
            echo "::error::release-notes failed; see the job log"
            {
              echo "**These notes could not be derived.** The tooling that"
              echo "reads what changed between \`$previous\` and \`$TAG\` refused"
              echo "rather than report nothing; see this job's log."
              echo "The images below are unaffected."
              echo
            } >> notes.md
          fi

          # A fixed preamble; --generate-notes appends the PR list under it.
          # The README is the manual, so this says only what someone holding
          # the download needs and links to the rest.
          cat >> notes.md <<EOF
          ## Getting it

          Omarchy $OMARCHY, packaged for NixOS. Two images, and the difference
          is what they carry.

          **\`$ISO\`** — $SIZE, carries the whole system closure. The install
          copies rather than downloads and needs no network at all. Take this
          one unless the download is what you mind.

          GitHub will not accept a file that size, so it is split. Put it back
          together and check it:

          \`\`\`
          cat $ISO.part-* > $ISO
          sha256sum -c --ignore-missing SHA256SUMS
          \`\`\`

          **\`$NETISO\`** — $NETSIZE, downloads the desktop as it installs.
          One file, no reassembly, and it needs a working network: its first
          screen offers Wi-Fi if there is no cable.

          \`\`\`
          sha256sum -c --ignore-missing SHA256SUMS
          \`\`\`

          (\`--ignore-missing\` because one SHA256SUMS covers both images, and
          nobody downloads both.)

          Then write one to a USB stick and boot it. See
          [Fresh-machine install](https://github.com/${{ github.repository }}#fresh-machine-install)
          for what happens next.
          EOF

      # Pre-release, deliberately, and it stays that way until there is a 1.0.
      # The README says there is not one yet; a release page should not imply
      # otherwise.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # --discussion-category, rather than posting the notes somewhere a
          # second time. GitHub opens an Announcements discussion carrying this
          # release's body and links the two, so there is one text and no copy
          # to drift: an edited release edits the discussion with it.
          #
          # It also gives the notes a place that takes replies. A release page
          # cannot be asked a question; the thing someone wants to say after
          # reading "cups-browsed was running as root and is now off" belongs
          # under it rather than in a new issue.
          gh release create "$TAG" out/* \
            --title "$TAG" \
            --notes-file notes.md \
            --generate-notes \
            --discussion-category announcements \
            --prerelease

      # Every installed machine points its flake at the `release` branch
      # (installer/mkFlake.nix): `nix flake update nixarchy` resolves whatever
      # this branch names, so moving it IS shipping the release to users --
      # deliberately, when a human cuts a tag, not with every bot merge that
      # moves main. Plain push, not force: a release branch that moved
      # backwards would downgrade the next machine to update, so a non
      # fast-forward here should fail loudly and be looked at.
      - name: Move the release branch to this tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: git push origin "refs/tags/$TAG^{}:refs/heads/release"

      # 5.6 GB of parts on the runner's root filesystem, which is the small
      # one. The workspace is cleaned at the start of the next run, but a
      # failed release should not sit on the disk until then.
      - name: Remove the split copies
        if: always()
        run: rm -rf out
